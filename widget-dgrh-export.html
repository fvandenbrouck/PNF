<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propositions PNF — Export DGRH</title>
<!-- Version v1.1 : message « liste vide » (aucune proposition déposée) au lieu d'un chargement sans fin ; démarrage sans attendre onRecords -->
<!-- Version v1.2 : nombre prévisionnel de sessions de formation (colonnes d'export) -->
<!-- Version v1 : export Excel (.xlsx) des propositions d'actions de formation, avec filtres de lignes et choix des colonnes ; lecture seule, sans cotation ni instruction ; réservé à la DGRH, à la chefferie et aux propriétaires -->
<script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --turquoise:#A8DDD8; --peach:#F9C59A; --strawberry:#F5A0A8; --lilas:#E8E8F5;
  --navy:#1B3A6B; --navy-l:#e8edf5; --bg:#F7F5F2; --white:#fff;
  --ink:#1a1208; --ink2:#4a3f2f; --ink3:#8a8070; --border:#E0D8CC;
  --danger:#8a2030; --danger-l:rgba(245,160,168,.28); --ok:#1a6b65; --ok-l:rgba(168,221,216,.35);
}
/* Défilement naturel de la page (pas de hauteur calculée) ; barre d'outils sticky seulement au-dessus de 760px. */
html, body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--ink); color-scheme:light; font-size:13px; }
.toolbar { background:var(--white); border-bottom:1px solid var(--border); padding:10px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; position:sticky; top:0; z-index:10; }
.tabs { display:flex; gap:6px; background:var(--bg); padding:4px; border:1px solid var(--border); border-radius:10px; flex-wrap:wrap; }
.tab { font-family:'DM Sans',sans-serif; font-size:12px; font-weight:700; border:0; background:transparent; color:var(--ink3); padding:8px 12px; border-radius:7px; cursor:pointer; white-space:nowrap; }
.tab.active { background:var(--navy); color:#fff; }
.count { font-family:'DM Mono',monospace; font-size:11px; color:var(--ink3); background:var(--lilas); padding:6px 12px; border-radius:999px; }
.page { padding:14px; display:grid; grid-template-columns:minmax(0,1fr); gap:12px; }
.pane > *, .modal-body { min-width:0; }
.panel { background:var(--white); border:1.5px solid var(--border); border-radius:12px; padding:12px 14px; }
.panel > summary { cursor:pointer; font-weight:700; font-size:12px; color:var(--navy); }
.panel h3 { font-family:'Fraunces',serif; font-size:15px; margin-bottom:8px; }
.section-title { font-family:'DM Mono',monospace; color:var(--ink3); text-transform:uppercase; letter-spacing:.08em; font-size:10px; font-weight:600; margin-bottom:6px; }
.grid-f { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px; margin-top:10px; }
.fld { display:flex; flex-direction:column; gap:3px; }
.fld > label { font-size:10px; font-weight:700; color:var(--ink3); text-transform:uppercase; letter-spacing:.05em; }
input[type=text], input[type=number], input[type=date], select, textarea { font-family:'DM Sans',sans-serif; font-size:12px; color:var(--ink)!important; -webkit-text-fill-color:var(--ink)!important; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:7px 9px; outline:none; width:100%; }
textarea { min-height:90px; resize:vertical; line-height:1.5; }
input:focus, select:focus, textarea:focus { border-color:var(--navy); background:#fff; }
select option { color:var(--ink); background:var(--white); }
input, select, textarea, button { color-scheme:light; }
.chk { display:flex; align-items:center; gap:6px; font-size:12px; cursor:pointer; }
.chk input { width:auto; accent-color:var(--navy); }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.btn { font-family:'DM Sans',sans-serif; font-size:12px; font-weight:700; padding:8px 12px; border-radius:8px; cursor:pointer; white-space:nowrap; border:1px solid var(--border); background:var(--white); color:var(--ink2); }
.btn:hover { border-color:var(--navy); color:var(--navy); }
.btn.primary { border:1.5px solid var(--navy); background:var(--navy); color:#fff; }
.btn.primary:hover { background:#0d2a52; color:#fff; }
.btn.danger { color:var(--danger); }
.btn.danger:hover { border-color:var(--danger); }
.btn.small { padding:5px 9px; font-size:11px; }
.btn[disabled] { opacity:.45; cursor:not-allowed; }
/* tableau */
.tbl-wrap { overflow-x:auto; border:1.5px solid var(--border); border-radius:12px; background:var(--white); }
table.t { border-collapse:collapse; width:100%; min-width:860px; }
table.t th { text-align:left; font-family:'DM Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink3); padding:9px 10px; border-bottom:1px solid var(--border); background:var(--bg); position:sticky; top:0; }
table.t td { padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top; font-size:12px; }
table.t tbody tr.clickable { cursor:pointer; }
table.t tbody tr.clickable:hover { background:var(--navy-l); }
.t-title { font-family:'Fraunces',serif; font-size:13.5px; font-weight:600; line-height:1.3; }
.t-sub { font-size:10.5px; color:var(--ink3); margin-top:2px; }
.chip { font-family:'DM Mono',monospace; font-size:9px; font-weight:700; padding:3px 8px; border-radius:4px; text-transform:uppercase; letter-spacing:.05em; white-space:nowrap; display:inline-block; }
.st-Reçue { background:var(--lilas); color:var(--navy); }
.st-En-cours { background:rgba(249,197,154,.45); color:#8a4a10; }
.st-Retenue { background:var(--ok-l); color:var(--ok); }
.st-Refusée { background:var(--danger-l); color:var(--danger); }
.st-Fusionnée { background:#ece7dd; color:var(--ink2); }
.flag { font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; margin-left:4px; }
.flag.bad { background:var(--danger-l); color:var(--danger); }
.flag.good { background:var(--ok-l); color:var(--ok); }
.gauge { height:8px; background:#ece7dd; border-radius:4px; overflow:hidden; min-width:54px; }
.gauge > i { display:block; height:100%; border-radius:4px; }
.g-row { display:flex; align-items:center; gap:8px; margin:3px 0; }
.g-row .g-l { min-width:210px; font-size:12px; }
.g-row .g-n { font-family:'DM Mono',monospace; font-size:11px; min-width:44px; text-align:right; }
.g-row .gauge { flex:1; height:11px; }
.mini { display:grid; gap:3px; min-width:96px; }
.mini .gauge { height:5px; }
.big-n { font-family:'Fraunces',serif; font-size:17px; font-weight:700; }
.empty { text-align:center; padding:60px 20px; color:var(--ink3); }
.empty p { font-family:'Fraunces',serif; font-size:22px; margin-bottom:8px; }
/* modale */
.overlay { position:fixed; inset:0; background:rgba(27,58,107,.45); backdrop-filter:blur(3px); z-index:200; display:flex; align-items:flex-start; justify-content:center; padding:20px; overflow-y:auto; }
.overlay.hidden { display:none; }
.modal { background:var(--white); border-radius:15px; width:100%; max-width:1020px; display:flex; flex-direction:column; box-shadow:0 24px 64px rgba(27,58,107,.25); margin:auto 0; }
.modal-head { padding:16px 22px 12px; border-bottom:1px solid var(--border); display:flex; gap:12px; align-items:flex-start; }
.modal-head h2 { font-family:'Fraunces',serif; font-size:19px; line-height:1.3; }
.modal-meta { font-family:'DM Mono',monospace; font-size:10px; color:var(--ink3); margin-top:5px; letter-spacing:.04em; }
.btn-close { margin-left:auto; border:none; background:transparent; font-size:24px; color:var(--ink3); cursor:pointer; padding:2px 6px; }
.modal-tabs { padding:8px 22px 0; display:flex; gap:6px; flex-wrap:wrap; border-bottom:1px solid var(--border); }
.mtab { font-size:12px; font-weight:700; border:0; background:transparent; color:var(--ink3); padding:8px 12px; border-bottom:3px solid transparent; cursor:pointer; }
.mtab.active { color:var(--navy); border-bottom-color:var(--navy); }
.modal-body { padding:16px 22px 22px; }
.pane { display:none; gap:14px; }
.pane.active { display:grid; }
.cmp { display:grid; grid-template-columns:150px 1fr 1fr 70px; gap:8px 12px; align-items:start; }
.cmp .h { font-family:'DM Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink3); }
.cmp .lab { font-size:11px; font-weight:700; color:var(--ink2); padding-top:7px; }
.cmp .dep { font-size:12px; color:var(--ink2); background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:7px 9px; white-space:pre-wrap; line-height:1.5; }
.mod-flag { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--strawberry); margin-left:6px; vertical-align:middle; }
.box { border:1.5px solid var(--border); border-radius:9px; background:var(--bg); padding:10px 12px; font-size:12px; line-height:1.55; }
.pub-list { max-height:150px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; background:var(--bg); padding:6px 8px; display:grid; gap:2px; }
.pub-cat { font-family:'DM Mono',monospace; font-size:9px; text-transform:uppercase; color:var(--ink3); margin-top:4px; }
.crit { display:grid; grid-template-columns:22px 1fr 150px 40px; gap:4px 8px; font-size:11.5px; padding:4px 0; border-bottom:1px dashed var(--border); align-items:start; }
.crit .m { color:var(--danger); font-size:10.5px; grid-column:2/5; }
.ic-ok { color:var(--ok); font-weight:700; } .ic-bad { color:var(--danger); font-weight:700; } .ic-mid { color:#a06a10; font-weight:700; } .ic-na { color:var(--ink3); }
.warn { background:var(--danger-l); color:var(--danger); border-radius:8px; padding:8px 10px; font-size:11.5px; }
.note { background:var(--ok-l); color:var(--ok); border-radius:8px; padding:8px 10px; font-size:11.5px; }
.grp { border:1px solid var(--border); border-radius:10px; padding:8px 10px; background:var(--white); }
.grp-h { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px; }
.grp-h b { font-size:12px; color:var(--navy); }
.cols-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; }
.cols-list { display:grid; gap:3px; }
.vs-sum { display:grid; grid-template-columns:170px 1fr; gap:4px 12px; font-size:12px; }
.vs-sum dt { color:var(--ink3); font-family:'DM Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:.06em; padding-top:3px; }
.vs-sum dd { margin:0; white-space:pre-wrap; }
.chk-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:3px 12px; }
.ct-row { display:grid; grid-template-columns:minmax(180px,1.2fr) 1fr 1fr; gap:8px; align-items:center; padding:6px 0; border-bottom:1px dashed var(--border); }
@media (max-width:760px) { .vs-sum, .ct-row { grid-template-columns:1fr; } }
#toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:10px; font-size:12px; z-index:600; opacity:0; pointer-events:none; transition:.2s; max-width:90vw; }
#toast.show { opacity:1; } #toast.err { background:var(--danger); }
#loader { position:fixed; inset:0; background:rgba(247,245,242,.92); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; z-index:500; }
#loader.hidden { display:none; }
.spinner { width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--navy); border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
@media (max-width:760px) {
  .toolbar { position:static; align-items:stretch; }
  .cmp { grid-template-columns:1fr; } .cmp .h { display:none; }
  .crit { grid-template-columns:22px 1fr 40px; } .crit .src { display:none; }
  .g-row .g-l { min-width:120px; }
}
</style>
</head>
<body>
<div class="toolbar" id="toolbar">
  <div class="tabs"><span class="tab active" style="cursor:default">Export des propositions (Excel)</span></div>
  <span class="count" id="count">–</span>
</div>
<div class="page" id="page"></div>
<div id="loader"><div class="spinner"></div><p>Chargement des propositions…</p></div>
<div id="toast"></div>
<script>
console.info('[widget-dgrh-export] v1.2 chargé');

/* ============================== constantes ============================== */
const PROP = 'Propositions_PNF';
const PARCOURS_LIB = { 'Magistère':1, 'Mentor':1 };
const ARR = [['Arr_besoins','Évaluation préalable des besoins (art. 2)'],['Arr_apports','Apports théoriques et pratiques (art. 2, 1°)'],['Arr_activite','Séquences de mise en activité (art. 2, 2°)'],['Arr_acquis','Évaluation des acquis (art. 2, 3°)'],['Arr_prerequis','Prérequis précisés (art. 3, 2°)'],['Arr_programme','Programme et séquencement (art. 3, 4° et 5°)']];

/* ============================== état ============================== */
let P = [], STRUCT = {}, AXE = {}, ACTION = {}, MODALITE = {}, FORMAT = {}, PUBLIC = {}, ANNEE = {}, PARAMS = {}, PERIODES = [];
let REPCOL = 'Report_d_une_action_prevue_initialement_au_PNF_de_l_annee_N_1', RELOAD_TIMER = null, ALLOWED = false;
const newF = () => ({ q:'', axe:'', action:'', structure:'', modalite:'', format:'', periode:'', du:'', au:'' });
let FE = newF();
let EX = { cols:new Set(), fmt:{ headers:'labels', listSep:' | ', dateXls:true }, excluded:new Set(), preset:'std-corrigees' };

/* ============================== utilitaires ============================== */
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm = s => String(s || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const clean = s => String(s ?? '').replace(/\s+/g, ' ').trim();
function toRows(t){ return (t && t.id || []).map((id,i) => { const r = { id }; Object.keys(t).forEach(k => { if (k !== 'id') r[k] = t[k][i]; }); return r; }); }
function asIds(v){ if (v == null || v === '' || v === 0) return []; if (Array.isArray(v)) return (v[0] === 'L' ? v.slice(1) : v).map(Number).filter(n => n > 0); const n = Number(v); return n > 0 ? [n] : []; }
const refId = v => { const a = asIds(v); return a.length ? a[0] : 0; };
const num = v => (v === null || v === undefined || v === '' ? null : (Number.isFinite(Number(v)) ? Number(v) : null));
function toDate(v){ if (v === null || v === undefined || v === '') return null; const ms = v > 20000000000 ? v : v * 1000; const d = new Date(ms); return isNaN(d.getTime()) ? null : d; }
const fmtDate = v => { const d = toDate(v); return d ? d.toLocaleDateString('fr-FR') : ''; };
const isoDate = v => { const d = toDate(v); return d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` : ''; };
function toast(msg, err){ const t = document.getElementById('toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : ''); clearTimeout(toast._t); toast._t = setTimeout(() => t.className = '', err ? 6000 : 2800); }
const showLoader = v => document.getElementById('loader').classList.toggle('hidden', !v);
function opt(v, label, sel){ return `<option value="${esc(v)}"${String(sel) === String(v) ? ' selected' : ''}>${esc(label)}</option>`; }
const jourHeures = () => num(PARAMS.jour_heures) || 6;

/* ============================== libellés ============================== */
const sCode = id => STRUCT[id] ? STRUCT[id].code : '';
const aLib = id => ACTION[id] ? clean(ACTION[id].libelle) : '';
const aNum = id => ACTION[id] ? ACTION[id].num_action : '';
const axeOf = aid => ACTION[aid] ? ACTION[aid].id_axe : 0;
const axeLib = aid => { const x = AXE[axeOf(aid)]; return x ? clean(x.libelle) : ''; };
const modLib = id => MODALITE[id] ? clean(MODALITE[id].libelle) : '';
const fmtLib = id => FORMAT[id] ? clean(FORMAT[id].libelle) : '';
const pubLibs = v => asIds(v).map(id => PUBLIC[id] ? clean(PUBLIC[id].libelle) : '').filter(Boolean);
const lst = v => Array.isArray(v) ? v : [];
const oriOf = p => lst(Array.isArray(p.Orientation_SD) && p.Orientation_SD[0] === 'L' ? p.Orientation_SD.slice(1) : p.Orientation_SD);
/* valeur retenue = valeur corrigée par la chefferie, à défaut la valeur déposée */
const refCur = (p, c, k) => refId(p[c]) || refId(p[k]);
const cDuree = p => (p.C_Duree_heures ?? p.Duree_heures);
const cEff = p => (p.C_Effectif_previsionnel ?? p.Effectif_previsionnel);

/* ============================== chargement ============================== */
async function fetchRows(t){ try { return toRows(await grist.docApi.fetchTable(t)); } catch (e) { console.warn('[dgrh] lecture impossible :', t, e); return []; } }
async function loadAll(){
  const props = toRows(await grist.docApi.fetchTable(PROP));                      // une erreur ici = droits insuffisants, signalée à l'écran
  const [structs, axes, acts, mods, pubs, annees, formats, params] = await Promise.all([
    fetchRows('Structures'), fetchRows('Axes'), fetchRows('Actions_axes'), fetchRows('Modalites'), fetchRows('Publics'), fetchRows('Annees'), fetchRows('Formats'), fetchRows('Parametres_recueil')
  ]);
  P = props; STRUCT = Object.fromEntries(structs.map(r => [r.id, r])); AXE = Object.fromEntries(axes.map(r => [r.id, r]));
  ACTION = Object.fromEntries(acts.map(r => [r.id, r])); MODALITE = Object.fromEntries(mods.map(r => [r.id, r])); PUBLIC = Object.fromEntries(pubs.map(r => [r.id, r]));
  ANNEE = Object.fromEntries(annees.map(r => [r.id, r])); FORMAT = Object.fromEntries(formats.map(r => [r.id, r]));
  PARAMS = Object.fromEntries(params.map(r => [r.cle, r.valeur]));                // vide pour la DGRH (table non lisible) : valeurs par défaut
  if (P.length) { const k = Object.keys(P[0]).find(x => x.startsWith('Report')); if (k) REPCOL = k; }
  PERIODES = [...new Set(P.map(p => p.C_Periode || p.Periode).filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b), 'fr'));
}
function scheduleReload(){ clearTimeout(RELOAD_TIMER); RELOAD_TIMER = setTimeout(async () => { try { await loadAll(); renderExport(); } catch (e) { console.warn(e); } }, 350); }

/* ============================== accès ============================== */
// Garde-fou d'affichage (la vraie barrière reste l'ACL) : la DGRH ne lit que sa propre ligne de Utilisateurs ; plusieurs lignes = Owner ou chefferie.
async function checkAccess(){
  try {
    const rows = toRows(await grist.docApi.fetchTable('Utilisateurs'));
    if (rows.length > 1) return true;
    if (rows.length === 1) return ['DGRH', 'Chefferie', 'Proprietaire'].includes(rows[0].ClasseNom);
    return false;
  } catch (e) { console.warn('[dgrh] vérification des droits impossible :', e); return false; }
}

/* ============================== filtres ============================== */
function matches(p, f){
  const act = refCur(p, 'C_Action_SD', 'Action_SD');
  if (f.q && !norm([p.id, p.C_Titre || p.Titre, p.C_Email_contact || p.Email_contact, sCode(refCur(p, 'C_Structure_porteuse', 'Structure_porteuse')), p.C_Objectifs || p.Objectifs].join(' ')).includes(norm(f.q))) return false;
  if (f.axe && String(axeOf(act)) !== f.axe) return false;
  if (f.action && String(act) !== f.action) return false;
  if (f.structure && String(refCur(p, 'C_Structure_porteuse', 'Structure_porteuse')) !== f.structure) return false;
  if (f.modalite && String(refCur(p, 'C_Modalite', 'Modalite')) !== f.modalite) return false;
  if (f.format && String(refCur(p, 'C_Format', 'Format')) !== f.format) return false;
  if (f.periode && (p.C_Periode || p.Periode) !== f.periode) return false;
  const d = isoDate(p.Date_depot);
  if (f.du && !(d && d >= f.du)) return false;
  if (f.au && !(d && d <= f.au)) return false;
  return true;
}
let _qTimer = null;
function setF(k, v){ FE[k] = v; renderExportBody(); }
function setFQ(v){ FE.q = v; clearTimeout(_qTimer); _qTimer = setTimeout(renderExportBody, 250); }
function resetF(){ FE = newF(); renderExport(); }
function filterPanel(){
  const f = FE;
  const structIds = [...new Set(P.map(p => refCur(p, 'C_Structure_porteuse', 'Structure_porteuse')).filter(Boolean))].sort((a, b) => sCode(a).localeCompare(sCode(b), 'fr', { numeric:true }));
  const acts = Object.values(ACTION).sort((a, b) => a.num_action - b.num_action);
  return `<div class="grid-f">
    <div class="fld"><label>Recherche</label><input type="text" value="${esc(f.q)}" placeholder="Titre, structure, adresse…" oninput="setFQ(this.value)"></div>
    <div class="fld"><label>Axe</label><select onchange="setF('axe',this.value)"><option value="">Tous</option>${Object.values(AXE).map(a => opt(a.id, clean(a.libelle), f.axe)).join('')}</select></div>
    <div class="fld"><label>Action</label><select onchange="setF('action',this.value)"><option value="">Toutes</option>${acts.map(a => opt(a.id, 'Action ' + a.num_action, f.action)).join('')}</select></div>
    <div class="fld"><label>Structure porteuse</label><select onchange="setF('structure',this.value)"><option value="">Toutes</option>${structIds.map(s => opt(s, sCode(s), f.structure)).join('')}</select></div>
    <div class="fld"><label>Modalité</label><select onchange="setF('modalite',this.value)"><option value="">Toutes</option>${Object.values(MODALITE).map(m => opt(m.id, clean(m.libelle), f.modalite)).join('')}</select></div>
    <div class="fld"><label>Modalité pédagogique</label><select onchange="setF('format',this.value)"><option value="">Toutes</option>${Object.values(FORMAT).map(m => opt(m.id, clean(m.libelle), f.format)).join('')}</select></div>
    <div class="fld"><label>Période</label><select onchange="setF('periode',this.value)"><option value="">Toutes</option>${PERIODES.map(x => opt(x, x, f.periode)).join('')}</select></div>

    <details class="panel" open><summary>2. Lignes à exporter — filtres</summary>${filterPanel()}</details>
    <div class="panel"><h3>3. Colonnes à exporter</h3><div class="cols-grid">${groups.map(g => {
      const cs = EXPORT_COLS.filter(c => c.g === g), n = cs.filter(c => EX.cols.has(c.k)).length;
      return `<div class="grp"><div class="grp-h"><b>${esc(g)} <span class="t-sub">(${n}/${cs.length})</span></b><span><button class="btn small" onclick="setGroup('${g.replace(/'/g, "\\'")}',true)">Tout</button> <button class="btn small" onclick="setGroup('${g.replace(/'/g, "\\'")}',false)">Aucun</button></span></div>
        <div class="cols-list">${cs.map(c => `<label class="chk"><input type="checkbox" ${EX.cols.has(c.k) ? 'checked' : ''} onchange="toggleCol('${c.k}',this.checked)">${esc(c.l)}</label>`).join('')}</div></div>`;
    }).join('')}</div></div>
    <div class="panel"><h3>4. Options du fichier</h3><div class="row">
      <div class="fld"><label>En-têtes</label><select onchange="setFmt('headers',this.value)">${opt('labels', 'Libellés lisibles', EX.fmt.headers)}${opt('codes', 'Codes courts', EX.fmt.headers)}</select></div>
      <div class="fld"><label>Séparateur des listes (publics, orientations)</label><select onchange="setFmt('listSep',this.value)">${opt(' | ', 'Barre verticale ( | )', EX.fmt.listSep)}${opt('; ', 'Point-virgule + espace', EX.fmt.listSep)}${opt(', ', 'Virgule + espace', EX.fmt.listSep)}${opt('\n', 'Retour à la ligne', EX.fmt.listSep)}</select></div>
      <label class="chk" style="margin-top:16px"><input type="checkbox" ${EX.fmt.dateXls ? 'checked' : ''} onchange="setFmt('dateXls',this.checked)">Dates au format Excel (JJ/MM/AAAA, triables)</label></div></div>
    <div id="ex-body"></div>`;
  renderExportBody();
}
function renderExportBody(){
  const body = document.getElementById('ex-body'); if (!body) return;
  const matching = P.filter(p => matches(p, FE)).sort((a, b) => a.id - b.id);
  body.innerHTML = `<div class="panel"><h3>5. Lignes retenues pour l'export</h3>
    <div class="row"><span id="ex-count" class="count"></span><button class="btn small" onclick="setAllRows(true)">Tout cocher</button><button class="btn small" onclick="setAllRows(false)">Tout décocher</button><span class="t-sub">Décochez une ligne pour l'exclure de l'export.</span></div>
    ${matching.length ? `<div class="tbl-wrap" style="margin-top:8px;max-height:260px;overflow-y:auto"><table class="t" style="min-width:560px"><thead><tr><th></th><th>N°</th><th>Titre</th><th>Structure</th><th>Action</th></tr></thead><tbody>${matching.map(p => `<tr><td><input type="checkbox" style="width:auto" ${EX.excluded.has(p.id) ? '' : 'checked'} onchange="toggleRow(${p.id},this.checked)"></td><td>${p.id}</td><td>${esc(p.C_Titre || p.Titre || 'Sans titre')}</td><td>${esc(sCode(refCur(p, 'C_Structure_porteuse', 'Structure_porteuse')))}</td><td>${refCur(p, 'C_Action_SD', 'Action_SD') ? 'Action ' + esc(aNum(refCur(p, 'C_Action_SD', 'Action_SD'))) : '–'}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty" style="padding:20px">${P.length ? 'Aucune proposition ne correspond aux filtres.' : 'Aucune proposition déposée pour le moment.'}</div>`}</div>
    <div class="panel"><h3>6. Aperçu et téléchargement</h3><div id="ex-preview"></div><div class="row" style="margin-top:10px"><button class="btn primary" id="ex-dl" onclick="downloadExport()">Télécharger le fichier Excel (.xlsx)</button></div></div>`;
  renderExportPreview();
}
function renderExportPreview(){
  const rows = exportRows(), cols = selectedCols(), c = document.getElementById('ex-count'), pv = document.getElementById('ex-preview'); if (!pv) return;
  document.getElementById('count').textContent = `${rows.length} ligne(s) · ${cols.length} colonne(s)`;
  if (c) c.textContent = `${rows.length} proposition(s) sélectionnée(s) sur ${P.length}`;
  const dl = document.getElementById('ex-dl'); if (dl) dl.disabled = !rows.length || !cols.length;
  if (!cols.length || !rows.length) { pv.innerHTML = `<div class="t-sub">${!cols.length ? 'Aucune colonne cochée.' : 'Aucune ligne à exporter.'}</div>`; return; }
  pv.innerHTML = `<div class="tbl-wrap"><table class="t" style="min-width:${Math.max(560, cols.length * 130)}px"><thead><tr>${cols.map(x => `<th>${esc(EX.fmt.headers === 'codes' ? x.k : x.l)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0, 5).map(p => `<tr>${cols.map(x => { const t = cellText(x, p); return `<td title="${esc(t)}">${esc(t.length > 90 ? t.slice(0, 90) + '…' : t)}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div><div class="t-sub" style="margin-top:4px">Aperçu des ${Math.min(5, rows.length)} premières lignes sur ${rows.length}.</div>`;
}

/* ============================== démarrage ============================== */
async function start(){
  showLoader(true);
  try {
    let n = 0; while (!grist.docApi && n < 20) { await new Promise(r => setTimeout(r, 100)); n++; }
    ALLOWED = await checkAccess();
    if (!ALLOWED) {
      document.getElementById('toolbar').style.display = 'none';
      document.getElementById('page').innerHTML = `<div class="empty"><p>Accès réservé</p><span>Cette page est réservée à la DGRH et à la chefferie.</span></div>`; return;
    }
    await loadAll(); applyPreset('std-corrigees'); renderExport();
  } catch (e) {
    console.error(e);
    document.getElementById('toolbar').style.display = 'none';
    document.getElementById('page').innerHTML = `<div class="empty"><p>Lecture impossible</p><span>Vos droits ne permettent pas de lire les propositions. Contactez la chefferie. (${esc(e.message || e)})</span></div>`;
  } finally { showLoader(false); }
}
grist.ready({ requiredAccess:'full', columns:[] });
let _started = false;
grist.onRecords(() => { if (!_started) { _started = true; start(); } else if (ALLOWED) scheduleReload(); });
// Grist n'appelle pas toujours onRecords pour une table vide : on démarre quand même, sans attendre.
setTimeout(() => { if (!_started) { _started = true; start(); } }, 800);
</script>
</body>
</html>
