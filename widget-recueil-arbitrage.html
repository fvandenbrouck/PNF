<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recueil des besoins PNF — Arbitrage</title>
<!-- Version v1 : liste des propositions, fiche (déposé/corrigé, évaluation, instruction avec fusion, fiche de retour) et export CSV avec filtres, cases à cocher et modèles partagés -->
<!-- Version v2 : fusions en chaîne (une proposition principale peut elle-même être fusionnée) ; champs corrigeables ajoutés (adresse électronique, pluriannuelle, report) ; onglet Versement vers Actions_formation (contacts créés si absents, dates, volet, degrés, lieux) -->
<!-- Version v2.1 : libellés « catalogue des actions » (bouton Verser, messages) ; le dépassement du délai n'est plus rédhibitoire (réglage des critères dans Grist) -->
<!-- Version v2.2 : note de pertinence supprimée (note globale 100 % automatique, filtre « Pertinence à noter » retiré) ; la case « Incompatibilité constatée » est conservée -->
<!-- Version v2.3 : à la fusion, l'effectif et la durée de la proposition principale prennent le maximum des deux (et non plus leur somme) -->
<!-- Version v2.4 : champs texte corrigés nettoyés des espaces superflus ; message « Versement en cours » pendant le versement -->
<!-- Version v2.5 : fiche de retour supprimée (onglet, texte généré et bouton de copie) -->
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --turquoise:#A8DDD8; --peach:#F9C59A; --strawberry:#F5A0A8; --lilas:#E8E8F5;
  --navy:#1B3A6B; --navy-l:#e8edf5; --bg:#F7F5F2; --white:#fff;
  --ink:#1a1208; --ink2:#4a3f2f; --ink3:#8a8070; --border:#E0D8CC;
  --danger:#8a2030; --danger-l:rgba(245,160,168,.28); --ok:#1a6b65; --ok-l:rgba(168,221,216,.35);
}
/* Défilement naturel de la page (pas de hauteur calculée) ; barre d'outils sticky seulement au-dessus de 760px. */
html, body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--ink); color-scheme:light; font-size:13px; }
.toolbar { background:var(--white); border-bottom:1px solid var(--border); padding:10px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; position:sticky; top:0; z-index:10; }
.tabs { display:flex; gap:6px; background:var(--bg); padding:4px; border:1px solid var(--border); border-radius:10px; flex-wrap:wrap; }
.tab { font-family:'DM Sans',sans-serif; font-size:12px; font-weight:700; border:0; background:transparent; color:var(--ink3); padding:8px 12px; border-radius:7px; cursor:pointer; white-space:nowrap; }
.tab.active { background:var(--navy); color:#fff; }
.count { font-family:'DM Mono',monospace; font-size:11px; color:var(--ink3); background:var(--lilas); padding:6px 12px; border-radius:999px; }
.page { padding:14px; display:grid; grid-template-columns:minmax(0,1fr); gap:12px; }
.pane > *, .modal-body { min-width:0; }
.panel { background:var(--white); border:1.5px solid var(--border); border-radius:12px; padding:12px 14px; }
.panel > summary { cursor:pointer; font-weight:700; font-size:12px; color:var(--navy); }
.panel h3 { font-family:'Fraunces',serif; font-size:15px; margin-bottom:8px; }
.section-title { font-family:'DM Mono',monospace; color:var(--ink3); text-transform:uppercase; letter-spacing:.08em; font-size:10px; font-weight:600; margin-bottom:6px; }
.grid-f { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px; margin-top:10px; }
.fld { display:flex; flex-direction:column; gap:3px; }
.fld > label { font-size:10px; font-weight:700; color:var(--ink3); text-transform:uppercase; letter-spacing:.05em; }
input[type=text], input[type=number], input[type=date], select, textarea { font-family:'DM Sans',sans-serif; font-size:12px; color:var(--ink)!important; -webkit-text-fill-color:var(--ink)!important; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:7px 9px; outline:none; width:100%; }
textarea { min-height:90px; resize:vertical; line-height:1.5; }
input:focus, select:focus, textarea:focus { border-color:var(--navy); background:#fff; }
select option { color:var(--ink); background:var(--white); }
input, select, textarea, button { color-scheme:light; }
.chk { display:flex; align-items:center; gap:6px; font-size:12px; cursor:pointer; }
.chk input { width:auto; accent-color:var(--navy); }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.btn { font-family:'DM Sans',sans-serif; font-size:12px; font-weight:700; padding:8px 12px; border-radius:8px; cursor:pointer; white-space:nowrap; border:1px solid var(--border); background:var(--white); color:var(--ink2); }
.btn:hover { border-color:var(--navy); color:var(--navy); }
.btn.primary { border:1.5px solid var(--navy); background:var(--navy); color:#fff; }
.btn.primary:hover { background:#0d2a52; color:#fff; }
.btn.danger { color:var(--danger); }
.btn.danger:hover { border-color:var(--danger); }
.btn.small { padding:5px 9px; font-size:11px; }
.btn[disabled] { opacity:.45; cursor:not-allowed; }
/* tableau */
.tbl-wrap { overflow-x:auto; border:1.5px solid var(--border); border-radius:12px; background:var(--white); }
table.t { border-collapse:collapse; width:100%; min-width:860px; }
table.t th { text-align:left; font-family:'DM Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink3); padding:9px 10px; border-bottom:1px solid var(--border); background:var(--bg); position:sticky; top:0; }
table.t td { padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top; font-size:12px; }
table.t tbody tr.clickable { cursor:pointer; }
table.t tbody tr.clickable:hover { background:var(--navy-l); }
.t-title { font-family:'Fraunces',serif; font-size:13.5px; font-weight:600; line-height:1.3; }
.t-sub { font-size:10.5px; color:var(--ink3); margin-top:2px; }
.chip { font-family:'DM Mono',monospace; font-size:9px; font-weight:700; padding:3px 8px; border-radius:4px; text-transform:uppercase; letter-spacing:.05em; white-space:nowrap; display:inline-block; }
.st-Reçue { background:var(--lilas); color:var(--navy); }
.st-En-cours { background:rgba(249,197,154,.45); color:#8a4a10; }
.st-Retenue { background:var(--ok-l); color:var(--ok); }
.st-Refusée { background:var(--danger-l); color:var(--danger); }
.st-Fusionnée { background:#ece7dd; color:var(--ink2); }
.flag { font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; margin-left:4px; }
.flag.bad { background:var(--danger-l); color:var(--danger); }
.flag.good { background:var(--ok-l); color:var(--ok); }
.gauge { height:8px; background:#ece7dd; border-radius:4px; overflow:hidden; min-width:54px; }
.gauge > i { display:block; height:100%; border-radius:4px; }
.g-row { display:flex; align-items:center; gap:8px; margin:3px 0; }
.g-row .g-l { min-width:210px; font-size:12px; }
.g-row .g-n { font-family:'DM Mono',monospace; font-size:11px; min-width:44px; text-align:right; }
.g-row .gauge { flex:1; height:11px; }
.mini { display:grid; gap:3px; min-width:96px; }
.mini .gauge { height:5px; }
.big-n { font-family:'Fraunces',serif; font-size:17px; font-weight:700; }
.empty { text-align:center; padding:60px 20px; color:var(--ink3); }
.empty p { font-family:'Fraunces',serif; font-size:22px; margin-bottom:8px; }
/* modale */
.overlay { position:fixed; inset:0; background:rgba(27,58,107,.45); backdrop-filter:blur(3px); z-index:200; display:flex; align-items:flex-start; justify-content:center; padding:20px; overflow-y:auto; }
.overlay.hidden { display:none; }
.modal { background:var(--white); border-radius:15px; width:100%; max-width:1020px; display:flex; flex-direction:column; box-shadow:0 24px 64px rgba(27,58,107,.25); margin:auto 0; }
.modal-head { padding:16px 22px 12px; border-bottom:1px solid var(--border); display:flex; gap:12px; align-items:flex-start; }
.modal-head h2 { font-family:'Fraunces',serif; font-size:19px; line-height:1.3; }
.modal-meta { font-family:'DM Mono',monospace; font-size:10px; color:var(--ink3); margin-top:5px; letter-spacing:.04em; }
.btn-close { margin-left:auto; border:none; background:transparent; font-size:24px; color:var(--ink3); cursor:pointer; padding:2px 6px; }
.modal-tabs { padding:8px 22px 0; display:flex; gap:6px; flex-wrap:wrap; border-bottom:1px solid var(--border); }
.mtab { font-size:12px; font-weight:700; border:0; background:transparent; color:var(--ink3); padding:8px 12px; border-bottom:3px solid transparent; cursor:pointer; }
.mtab.active { color:var(--navy); border-bottom-color:var(--navy); }
.modal-body { padding:16px 22px 22px; }
.pane { display:none; gap:14px; }
.pane.active { display:grid; }
.cmp { display:grid; grid-template-columns:150px 1fr 1fr 70px; gap:8px 12px; align-items:start; }
.cmp .h { font-family:'DM Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink3); }
.cmp .lab { font-size:11px; font-weight:700; color:var(--ink2); padding-top:7px; }
.cmp .dep { font-size:12px; color:var(--ink2); background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:7px 9px; white-space:pre-wrap; line-height:1.5; }
.mod-flag { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--strawberry); margin-left:6px; vertical-align:middle; }
.box { border:1.5px solid var(--border); border-radius:9px; background:var(--bg); padding:10px 12px; font-size:12px; line-height:1.55; }
.pub-list { max-height:150px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; background:var(--bg); padding:6px 8px; display:grid; gap:2px; }
.pub-cat { font-family:'DM Mono',monospace; font-size:9px; text-transform:uppercase; color:var(--ink3); margin-top:4px; }
.crit { display:grid; grid-template-columns:22px 1fr 150px 40px; gap:4px 8px; font-size:11.5px; padding:4px 0; border-bottom:1px dashed var(--border); align-items:start; }
.crit .m { color:var(--danger); font-size:10.5px; grid-column:2/5; }
.ic-ok { color:var(--ok); font-weight:700; } .ic-bad { color:var(--danger); font-weight:700; } .ic-mid { color:#a06a10; font-weight:700; } .ic-na { color:var(--ink3); }
.warn { background:var(--danger-l); color:var(--danger); border-radius:8px; padding:8px 10px; font-size:11.5px; }
.note { background:var(--ok-l); color:var(--ok); border-radius:8px; padding:8px 10px; font-size:11.5px; }
.grp { border:1px solid var(--border); border-radius:10px; padding:8px 10px; background:var(--white); }
.grp-h { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px; }
.grp-h b { font-size:12px; color:var(--navy); }
.cols-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; }
.cols-list { display:grid; gap:3px; }
.vs-sum { display:grid; grid-template-columns:170px 1fr; gap:4px 12px; font-size:12px; }
.vs-sum dt { color:var(--ink3); font-family:'DM Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:.06em; padding-top:3px; }
.vs-sum dd { margin:0; white-space:pre-wrap; }
.chk-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:3px 12px; }
.ct-row { display:grid; grid-template-columns:minmax(180px,1.2fr) 1fr 1fr; gap:8px; align-items:center; padding:6px 0; border-bottom:1px dashed var(--border); }
@media (max-width:760px) { .vs-sum, .ct-row { grid-template-columns:1fr; } }
#toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:10px; font-size:12px; z-index:600; opacity:0; pointer-events:none; transition:.2s; max-width:90vw; }
#toast.show { opacity:1; } #toast.err { background:var(--danger); }
#loader { position:fixed; inset:0; background:rgba(247,245,242,.92); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; z-index:500; }
#loader.hidden { display:none; }
.spinner { width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--navy); border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
@media (max-width:760px) {
  .toolbar { position:static; align-items:stretch; }
  .cmp { grid-template-columns:1fr; } .cmp .h { display:none; }
  .crit { grid-template-columns:22px 1fr 40px; } .crit .src { display:none; }
  .g-row .g-l { min-width:120px; }
}
</style>
</head>
<body>
<div class="toolbar" id="toolbar">
  <div class="tabs" role="tablist">
    <button type="button" class="tab active" id="tab-list" onclick="setTab('list')">Propositions</button>
    <button type="button" class="tab" id="tab-export" onclick="setTab('export')">Export CSV</button>
  </div>
  <span class="count" id="count">–</span>
</div>
<div class="page" id="page"></div>
<div id="loader"><div class="spinner"></div><p>Chargement des propositions…</p></div>
<div class="overlay hidden" id="overlay" onmousedown="overlayDown(event)">
  <div class="modal" id="modal"></div>
</div>
<div id="toast"></div>
<script>
console.info('[widget-recueil-arbitrage] v2.5 chargé');

/* ============================== constantes ============================== */
const PROP = 'Propositions_PNF', MODELES_T = 'Modeles_export';
const STATUTS = ['Reçue', "En cours d'instruction", 'Retenue', 'Refusée', 'Fusionnée'];
const PERIODES_DEFAUT = ['Septembre - décembre 2027', 'Janvier - mars 2028', 'Avril - juin 2028', "Au fil de l'année"];
const ARR = [['Arr_besoins','Évaluation préalable des besoins (art. 2)'],['Arr_apports','Apports théoriques et pratiques (art. 2, 1°)'],['Arr_activite','Séquences de mise en activité (art. 2, 2°)'],['Arr_acquis','Évaluation des acquis (art. 2, 3°)'],['Arr_prerequis','Prérequis précisés (art. 3, 2°)'],['Arr_programme','Programme et séquencement (art. 3, 4° et 5°)'],['Arr_attestation','Document attestant le suivi (art. 3, 6°)']];

/* ============================== état ============================== */
let P = [], STRUCT = {}, AXE = {}, ACTION = {}, MODALITE = {}, PUBLIC = {}, ANNEE = {}, CRIT = [], PARAMS = {}, MODELES = [], PERIODES = PERIODES_DEFAUT.slice();
let CONTACTS = [], VOLETS = {}, DEGRES = {}, LIEUX = {}, AF = [], VERSING = false;
let REPCOL = 'Report_d_une_action_prevue_initialement_au_PNF_de_l_annee_N_1';
let TAB = 'list', SORT = 'date_desc', MODAL = null, RELOAD_TIMER = null;
const newF = () => ({ q:'', statuts:new Set(), axe:'', action:'', structure:'', modalite:'', periode:'', noteMin:'', noteMax:'', du:'', au:'', rouge:false, versees:'' });
let FL = newF(), FE = newF();
let EX = { mode:'Sans cotation', cols:new Set(), fmt:{ sep:';', bom:true, dateFr:true, decComma:true, headers:'labels', listSep:' | ' }, excluded:new Set(), preset:'std-sans', saving:false };

/* ============================== utilitaires ============================== */
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm = s => String(s || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const clean = s => String(s ?? '').replace(/\s+/g, ' ').trim();
function toRows(t){ return (t && t.id || []).map((id,i) => { const r = { id }; Object.keys(t).forEach(k => { if (k !== 'id') r[k] = t[k][i]; }); return r; }); }
function decode(v){
  if (Array.isArray(v) && v.length) {
    if (v[0] === 'O' && v[1] && typeof v[1] === 'object') { const o = {}; Object.keys(v[1]).forEach(k => o[k] = decode(v[1][k])); return o; }
    if (v[0] === 'L') return v.slice(1).map(decode);
    if (v[0] === 'E') return null;
  }
  return v;
}
function asIds(v){ if (v == null || v === '' || v === 0) return []; if (Array.isArray(v)) return (v[0] === 'L' ? v.slice(1) : v).map(Number).filter(n => n > 0); const n = Number(v); return n > 0 ? [n] : []; }
const refId = v => { const a = asIds(v); return a.length ? a[0] : 0; };
const num = v => (v === null || v === undefined || v === '' ? null : (Number.isFinite(Number(v)) ? Number(v) : null));
const fmtN = (n, d = 1) => (n === null || n === undefined ? '–' : (Math.round(n * 10 ** d) / 10 ** d).toString().replace('.', ','));
function toDate(v){ if (v === null || v === undefined || v === '') return null; const ms = v > 20000000000 ? v : v * 1000; const d = new Date(ms); return isNaN(d.getTime()) ? null : d; }
const fmtDate = v => { const d = toDate(v); return d ? d.toLocaleDateString('fr-FR') : ''; };
const isoDate = v => { const d = toDate(v); return d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` : ''; };
function toast(msg, err){ const t = document.getElementById('toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : ''); clearTimeout(toast._t); toast._t = setTimeout(() => t.className = '', err ? 6000 : 2800); }
const showLoader = v => document.getElementById('loader').classList.toggle('hidden', !v);

/* ============================== libellés ============================== */
const sCode = id => STRUCT[id] ? STRUCT[id].code : '';
const sFull = id => STRUCT[id] ? `${STRUCT[id].code} — ${clean(STRUCT[id].libelle)}` : '';
const aLib = id => ACTION[id] ? clean(ACTION[id].libelle) : '';
const aNum = id => ACTION[id] ? ACTION[id].num_action : '';
const axeOf = aid => ACTION[aid] ? ACTION[aid].id_axe : 0;
const axeLib = aid => { const x = AXE[axeOf(aid)]; return x ? clean(x.libelle) : ''; };
const modLib = id => MODALITE[id] ? clean(MODALITE[id].libelle) : '';
const pubLibs = v => asIds(v).map(id => PUBLIC[id] ? clean(PUBLIC[id].libelle) : '').filter(Boolean);
const statutOf = p => p.Statut_instruction || 'Reçue';
const stClass = s => 'st-' + (s === "En cours d'instruction" ? 'En-cours' : s);
const jourHeures = () => num(PARAMS.jour_heures) || 6;
function ev(p){ if (p._ev === undefined) { const e = decode(p.Evaluation); p._ev = (e && typeof e === 'object' && !Array.isArray(e)) ? e : null; } return p._ev; }
const isRouge = p => p.Redhibitoire === true;
const isVersee = p => refId(p.Id_action_creee) > 0;
const fusionDans = p => refId(p.Fusionnee_dans);
const fusionnees = id => P.filter(x => fusionDans(x) === id);               // fusionnées directement dans id
function descendants(id, seen = new Set()){                                  // toutes les fusionnées, à tous les niveaux
  const out = [];
  fusionnees(id).forEach(k => { if (seen.has(k.id)) return; seen.add(k.id); out.push(k, ...descendants(k.id, seen)); });
  return out;
}
function racine(p){                                                          // proposition principale « de tête » d'un groupe fusionné
  let cur = p, n = 0;
  while (fusionDans(cur) && n++ < 50) { const up = P.find(x => x.id === fusionDans(cur)); if (!up) break; cur = up; }
  return cur;
}
const groupeVerse = p => isVersee(racine(p));
function gaugeColor(s){ const v = Math.max(0, Math.min(10, s || 0)); return `hsl(${Math.round(v * 12)},62%,45%)`; }
function gauge(s){ return `<div class="gauge"><i style="width:${s === null || s === undefined ? 0 : Math.max(0, Math.min(10, s)) * 10}%;background:${gaugeColor(s)}"></i></div>`; }
const cEff = p => (p.C_Effectif_previsionnel ?? p.Effectif_previsionnel);
const cDuree = p => (p.C_Duree_jours ?? p.Duree_jours);

/* ============================== chargement ============================== */
async function fetchRows(t){ try { return toRows(await grist.docApi.fetchTable(t)); } catch (e) { console.warn('[arbitrage] lecture impossible :', t, e); return []; } }
async function loadAll(){
  const [props, structs, axes, acts, mods, pubs, annees, crit, params, modeles, contacts, volets, degres, lieux] = await Promise.all([
    fetchRows(PROP), fetchRows('Structures'), fetchRows('Axes'), fetchRows('Actions_axes'), fetchRows('Modalites'), fetchRows('Publics'), fetchRows('Annees'), fetchRows('Criteres_evaluation'), fetchRows('Parametres_recueil'), fetchRows(MODELES_T),
    fetchRows('Contacts'), fetchRows('Volets'), fetchRows('Degres'), fetchRows('Lieux')
  ]);
  AF = await fetchRows('Actions_formation');
  CONTACTS = contacts; VOLETS = Object.fromEntries(volets.map(r => [r.id, r])); DEGRES = Object.fromEntries(degres.map(r => [r.id, r])); LIEUX = Object.fromEntries(lieux.map(r => [r.id, r]));
  P = props; STRUCT = Object.fromEntries(structs.map(r => [r.id, r])); AXE = Object.fromEntries(axes.map(r => [r.id, r]));
  ACTION = Object.fromEntries(acts.map(r => [r.id, r])); MODALITE = Object.fromEntries(mods.map(r => [r.id, r])); PUBLIC = Object.fromEntries(pubs.map(r => [r.id, r]));
  ANNEE = Object.fromEntries(annees.map(r => [r.id, r])); CRIT = crit; PARAMS = Object.fromEntries(params.map(r => [r.cle, r.valeur])); MODELES = modeles;
  if (P.length) { const k = Object.keys(P[0]).find(x => x.startsWith('Report')); if (k) REPCOL = k; }
  const used = [...new Set(P.map(p => p.Periode).filter(Boolean))];
  PERIODES = [...new Set([...PERIODES_DEFAUT, ...used])];
  try { // choix de la colonne Periode (si les métadonnées sont lisibles)
    const tabs = toRows(await grist.docApi.fetchTable('_grist_Tables')); const tid = (tabs.find(t => t.tableId === PROP) || {}).id;
    const cols = toRows(await grist.docApi.fetchTable('_grist_Tables_column')); const c = cols.find(x => x.parentId === tid && x.colId === 'Periode');
    const ch = c && JSON.parse(c.widgetOptions || '{}').choices; if (ch && ch.length) PERIODES = [...new Set([...ch, ...used])];
  } catch (e) { /* repli sur les valeurs par défaut */ }
}
async function reload(){ await loadAll(); renderAll(); }

/* ============================== filtres ============================== */
function matches(p, f){
  const act = refId(p.Action_SD);
  if (f.q && !norm([p.id, p.Titre, p.Email_contact, sCode(refId(p.Structure_porteuse)), p.Objectifs].join(' ')).includes(norm(f.q))) return false;
  if (f.statuts.size && !f.statuts.has(statutOf(p))) return false;
  if (f.axe && String(axeOf(act)) !== f.axe) return false;
  if (f.action && String(act) !== f.action) return false;
  if (f.structure && String(refId(p.Structure_porteuse)) !== f.structure) return false;
  if (f.modalite && String(refId(p.Modalite)) !== f.modalite) return false;
  if (f.periode && p.Periode !== f.periode) return false;
  const g = num(p.Score_global);
  if (f.noteMin !== '' && !(g !== null && g >= Number(f.noteMin))) return false;
  if (f.noteMax !== '' && !(g !== null && g <= Number(f.noteMax))) return false;
  const d = isoDate(p.Date_depot);
  if (f.du && !(d && d >= f.du)) return false;
  if (f.au && !(d && d <= f.au)) return false;
  if (f.rouge && !isRouge(p)) return false;
  if (f.versees === 'oui' && !isVersee(p)) return false;
  if (f.versees === 'non' && isVersee(p)) return false;
  return true;
}

function depText(p, f){

function sameVal(f, a, b){
  if (f.t === 'publics') return asIds(a).sort().join(',') === asIds(b).sort().join(',');
  if (['action', 'struct', 'modalite'].includes(f.t)) return refId(a) === refId(b);
  if (f.t === 'num' || f.t === 'int') return num(a) === num(b);
  if (f.t === 'text') return String(a ?? '') === String(b ?? '');   // exact : un nettoyage d'espaces est une vraie modification

async function writeFields(id, fields, okMsg){
  try {
    await grist.docApi.applyUserActions([['UpdateRecord', PROP, id, fields]]);
    await loadAll();
    const p = P.find(x => x.id === id); const bad = [];
    Object.keys(fields).forEach(k => { const f = EDITS.find(x => x.c === k) || { t: Array.isArray(fields[k]) ? 'publics' : (typeof fields[k] === 'number' ? 'num' : 'text') }; if (!sameVal(f, fields[k], p[k])) bad.push(k); });
    renderAll();
    if (bad.length) { toast('Écriture non confirmée pour : ' + bad.join(', '), true); return false; }

    return `<div class="ct-row"><div><b>${esc(e.email)}</b></div>${c ? `<div class="note" style="grid-column:2/4">Contact existant : ${esc(contactName(c))}</div>` : `<input type="text" id="vs-nom-${i}" placeholder="NOM (obligatoire)"><input type="text" id="vs-pre-${i}" placeholder="Prénom (obligatoire)">`}</div>`; }).join('')
    : '<div class="warn">Aucune adresse électronique de contact : aucun contact ne sera rattaché à l\'action.</div>';

    <div class="panel"><h3>Valeurs reprises (issues des corrections)</h3><dl class="vs-sum">${sum.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
      <div class="t-sub" style="margin-top:6px">Pour changer l'une de ces valeurs, corrige-la dans l'onglet « Déposé / corrigé » avant de verser.</div></div>

const dateSec = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) / 1000 : null; };
function readVerse(p){
  const pl = versePlan(p), d1 = dateSec(document.getElementById('vs-debut').value), d2 = dateSec(document.getElementById('vs-fin').value), volet = Number(document.getElementById('vs-volet').value) || 0;
  if (!pl.titre) return { err: 'Le titre est vide (onglet Déposé / corrigé).' };
  if (!pl.act) return { err: 'Aucune action du schéma directeur : corrige-la dans l\'onglet Déposé / corrigé.' };
  if (!pl.annee) return { err: 'Année scolaire absente sur la proposition.' };
  if (d1 === null || d2 === null) return { err: 'Renseigne la date de début et la date de fin.' };
  if (d2 < d1) return { err: 'La date de fin est antérieure à la date de début.' };

  const contacts = [];
  for (let i = 0; i < pl.emails.length; i++) {

    const nom = clean(document.getElementById('vs-nom-' + i).value), pre = clean(document.getElementById('vs-pre-' + i).value);
    if (!nom || !pre) return { err: `Renseigne le nom et le prénom du contact ${e.email}.` };

function askVerse(){

  document.getElementById('vs-zone').innerHTML = `<div class="warn">Confirmer le versement ? Une action sera créée dans le catalogue des actions${neu ? ' et ' + neu + ' contact(s) ajouté(s) à la table Contacts' : ''}. Cette opération ne s'annule pas depuis ce widget.</div>

}
async function doVerse(){
  if (VERSING) return; VERSING = true;
  const btn = document.getElementById('vs-confirm'); if (btn) btn.disabled = true;
  const zone = document.getElementById('vs-zone'); if (zone) zone.insertAdjacentHTML('afterbegin', '<div class="note" id="vs-busy">Versement en cours (plusieurs étapes, quelques secondes)… ne ferme pas cette fiche.</div>');
  let createdId = 0;
  try {
    const id = MODAL.id; await loadAll();                       // état frais avant toute écriture
    const p = P.find(x => x.id === id);
    if (!p || isVersee(p) || fusionDans(p) || statutOf(p) !== 'Retenue') throw new Error('La proposition n\'est plus versable (déjà versée, fusionnée ou plus « Retenue »). Recharge la fiche.');
    const v = readVerse(p); if (v.err) throw new Error(v.err);
    const pl = v.pl, nouveaux = v.contacts.filter(c => !c.existing);
    if (nouveaux.length) {                                       // 1. contacts manquants
      await grist.docApi.applyUserActions(nouveaux.map(c => ['AddRecord', 'Contacts', null, { nom_prenom: `${c.nom} ${c.prenom}`, email: c.email, structure: c.struct || 0, NOM: c.nom, PRENOM: c.prenom }]));
      await loadAll();
    }
    const contactIds = pl.emails.map(e => (contactByEmail(e.email) || {}).id).filter(Boolean);
    if (contactIds.length !== pl.emails.length) throw new Error('Un contact est introuvable après sa création : rien n\'a été versé.');
    const before = new Set((await fetchRows('Actions_formation')).map(r => r.id));
    const fields = { titre: pl.titre, objectif: pl.objectif, date_debut: v.d1, date_fin: v.d2, id_volet: v.volet, id_axe: pl.axe, id_action_axe: pl.act, id_structure: ['L', ...pl.structs],
      id_modalite: pl.modalite, id_lieu: ['L', ...v.lieux], Annee_scolaire: pl.annee, Contacts: ['L', ...contactIds], id_publics: ['L', ...pl.publics], Degre: ['L', ...v.deg], JS_prevision: pl.js, heures_formation: pl.heures };
    await grist.docApi.applyUserActions([['AddRecord', 'Actions_formation', null, fields]]);   // 2. l'action
    const created = (await fetchRows('Actions_formation')).filter(r => !before.has(r.id));
    if (created.length !== 1) throw new Error(`Impossible d'identifier l'action créée (${created.length} nouvelle(s) ligne(s)) : vérifie le catalogue des actions avant de recommencer.`);
    createdId = created[0].id;
    await grist.docApi.applyUserActions([['UpdateRecord', PROP, id, { Id_action_creee: createdId }]]);   // 3. lien
    await loadAll();
    const a = AF.find(x => x.id === createdId), bad = [];
    if (!a) bad.push('action'); else {
      if (a.titre !== pl.titre) bad.push('titre'); if (num(a.date_debut) !== v.d1 || num(a.date_fin) !== v.d2) bad.push('dates'); if (refId(a.id_action_axe) !== pl.act) bad.push('action SD');
      if (asIds(a.id_structure).sort().join() !== pl.structs.slice().sort().join()) bad.push('structures'); if (asIds(a.Contacts).sort().join() !== contactIds.slice().sort().join()) bad.push('contacts');
      if (num(a.heures_formation) !== pl.heures || num(a.JS_prevision) !== pl.js) bad.push('heures/JS');
    }
    renderAll();
    if (refId(P.find(x => x.id === id).Id_action_creee) !== createdId) bad.push('lien');
    bad.length ? toast(`Action n° ${createdId} créée, mais écriture non confirmée pour : ${bad.join(', ')}. Vérifie le catalogue des actions.`, true) : toast(`Versé : action n° ${createdId} créée dans le catalogue des actions.`);
  } catch (e) {
    console.error(e);
    toast((createdId ? `Action n° ${createdId} créée MAIS non reliée à la proposition (note ce numéro). ` : '') + 'Échec du versement : ' + (e.message || e), true);
    if (btn) btn.disabled = false;
    const busy = document.getElementById('vs-busy'); if (busy) busy.remove();
  } finally { VERSING = false; }
}

function critNon(p){ const e = ev(p); return e ? (e.criteres || []).filter(c => c.bloc !== 'Alignement' && c.res !== null && c.res < 1).map(c => c.libelle + (c.motif ? ' (' + c.motif + ')' : '')) : []; }
const EXPORT_COLS = [
  { k:'id', g:G.ID, l:'N°', v:p => p.id }, { k:'date_depot', g:G.ID, l:'Date de dépôt', d:1, v:p => p.Date_depot },
  { k:'annee', g:G.ID, l:'Année scolaire', v:p => (ANNEE[refId(p.Annee_scolaire)] || {}).libelle || '' }, { k:'email', g:G.ID, l:'Adresse électronique de contact', v:p => p.Email_contact },
  { k:'structure_code', g:G.ID, l:'Structure porteuse (code)', v:p => sCode(refId(p.Structure_porteuse)) }, { k:'structure_lib', g:G.ID, l:'Structure porteuse (libellé)', v:p => clean((STRUCT[refId(p.Structure_porteuse)] || {}).libelle) },
  { k:'titre', g:G.DEP, l:'Titre', v:p => p.Titre }, { k:'objectifs', g:G.DEP, l:'Objectifs', v:p => p.Objectifs }, { k:'contexte', g:G.DEP, l:'Contexte de la demande', v:p => p.Contexte },
  { k:'action_num', g:G.DEP, l:'Action du schéma directeur (n°)', v:p => aNum(refId(p.Action_SD)) }, { k:'action_lib', g:G.DEP, l:'Action du schéma directeur (libellé)', v:p => aLib(refId(p.Action_SD)) },
  { k:'axe', g:G.DEP, l:'Axe du schéma directeur', v:p => axeLib(refId(p.Action_SD)) }, { k:'indicateur', g:G.DEP, l:'Indicateur du schéma directeur', v:p => p.Indicateur_SD },
  { k:'pluriannuelle', g:G.DEP, l:'Action pluriannuelle', v:p => p.Action_pluriannuelle }, { k:'report', g:G.DEP, l:'Report d\'une action du PNF précédent', v:p => p[REPCOL] },
  { k:'periode', g:G.DEP, l:'Période calendaire envisagée', v:p => p.Periode }, { k:'modalite', g:G.DEP, l:'Modalité de formation', v:p => modLib(refId(p.Modalite)) },
  { k:'publics', g:G.DEP, l:'Public cible', v:p => pubLibs(p.Public_cible) }, { k:'duree', g:G.DEP, l:'Durée (jours)', v:p => p.Duree_jours }, { k:'effectif', g:G.DEP, l:'Effectif prévisionnel', v:p => p.Effectif_previsionnel },
  { k:'lieu', g:G.DEP, l:'Lieu prévisionnel', v:p => p.Lieu }, { k:'commentaire_porteur', g:G.DEP, l:'Commentaire du porteur', v:p => p.Commentaire_porteur },
  { k:'c_titre', g:G.COR, l:'Titre (corrigé)', v:p => p.C_Titre }, { k:'c_objectifs', g:G.COR, l:'Objectifs (corrigés)', v:p => p.C_Objectifs },
  { k:'c_action_num', g:G.COR, l:'Action du schéma directeur (n°, corrigée)', v:p => aNum(refId(p.C_Action_SD)) }, { k:'c_action_lib', g:G.COR, l:'Action du schéma directeur (libellé, corrigé)', v:p => aLib(refId(p.C_Action_SD)) },
  { k:'c_axe', g:G.COR, l:'Axe du schéma directeur (corrigé)', v:p => axeLib(refId(p.C_Action_SD)) },
  { k:'c_structure_code', g:G.COR, l:'Structure porteuse (code, corrigée)', v:p => sCode(refId(p.C_Structure_porteuse)) }, { k:'c_structure_lib', g:G.COR, l:'Structure porteuse (libellé, corrigé)', v:p => clean((STRUCT[refId(p.C_Structure_porteuse)] || {}).libelle) },
  { k:'c_modalite', g:G.COR, l:'Modalité (corrigée)', v:p => modLib(refId(p.C_Modalite)) }, { k:'c_publics', g:G.COR, l:'Public cible (corrigé)', v:p => pubLibs(p.C_Publics) },
  { k:'c_periode', g:G.COR, l:'Période (corrigée)', v:p => p.C_Periode }, { k:'c_duree', g:G.COR, l:'Durée en jours (corrigée)', v:p => p.C_Duree_jours },
  { k:'c_effectif', g:G.COR, l:'Effectif prévisionnel (corrigé)', v:p => p.C_Effectif_previsionnel }, { k:'c_lieu', g:G.COR, l:'Lieu (corrigé)', v:p => p.C_Lieu },
  { k:'c_email', g:G.COR, l:'Adresse électronique de contact (corrigée)', v:p => p.C_Email_contact }, { k:'c_pluriannuelle', g:G.COR, l:'Action pluriannuelle (corrigée)', v:p => p.C_Action_pluriannuelle },
  { k:'c_report', g:G.COR, l:'Report d\'une action du PNF précédent (corrigé)', v:p => p.C_Report },
  { k:'heures', g:G.CAL, l:'Heures de formation (déposées)', v:p => p.Heures_prevues }, { k:'js', g:G.CAL, l:'Journées stagiaires (déposées)', v:p => p.JS_prevues },
  { k:'c_heures', g:G.CAL, l:'Heures de formation (corrigées)', v:p => (num(cDuree(p)) || 0) * jourHeures() }, { k:'c_js', g:G.CAL, l:'Journées stagiaires (corrigées)', v:p => (num(cDuree(p)) || 0) * (num(cEff(p)) || 0) },
  ...ARR.map(([k, l]) => ({ k:k.toLowerCase(), g:G.ARR, l, v:p => p[k] })),
  { k:'orientations', g:G.ORI, l:'Orientations du schéma directeur', v:p => oriOf(p) },
  { k:'note_globale', g:G.COT, cot:1, l:'Note globale (/10)', v:p => p.Score_global }, { k:'note_completude', g:G.COT, cot:1, l:'Complétude (/10)', v:p => p.Score_completude },
  { k:'note_conformite', g:G.COT, cot:1, l:'Conformité (/10)', v:p => p.Score_conformite }, { k:'note_alignement', g:G.COT, cot:1, l:'Alignement schéma directeur (/10)', v:p => p.Score_alignement },
  { k:'redhibitoire', g:G.COT, cot:1, l:'Rédhibitoire', v:p => (p.Redhibitoire ? 'Oui' : 'Non') }, { k:'veto', g:G.COT, cot:1, l:'Incompatibilité constatée par la chefferie', v:p => (p.Veto_chefferie ? 'Oui' : 'Non') },
  { k:'criteres_non', g:G.COT, cot:1, l:'Critères non satisfaits', v:p => critNon(p) },
  { k:'statut', g:G.INS, cot:1, l:'Statut d\'instruction', v:p => statutOf(p) }, { k:'fusionnee_dans', g:G.INS, cot:1, l:'Fusionnée dans (n°)', v:p => fusionDans(p) || '' },
  { k:'fusionnees', g:G.INS, cot:1, l:'Propositions fusionnées dans celle-ci (n°)', v:p => descendants(p.id).map(x => x.id) },
  { k:'commentaire_chefferie', g:G.INS, cot:1, l:'Commentaire de la chefferie', v:p => p.Commentaire_chefferie }, { k:'motif', g:G.INS, cot:1, l:'Motif de la décision', v:p => p.Motif_decision },
  { k:'action_creee', g:G.INS, cot:1, l:'Action créée dans le catalogue des actions (n°)', v:p => refId(p.Id_action_creee) || '' }
];
const availCols = mode => EXPORT_COLS.filter(c => mode === 'Avec cotation' || !c.cot);
const BUILTIN = {
  'std-sans':    { nom:'Sans cotation (standard)', mode:'Sans cotation', cols:() => availCols('Sans cotation').map(c => c.k) },
  'std-interne': { nom:'Interne complet', mode:'Avec cotation', cols:() => availCols('Avec cotation').map(c => c.k) }
};
function applyPreset(key){
  EX.preset = key;
  if (BUILTIN[key]) { EX.mode = BUILTIN[key].mode; EX.cols = new Set(BUILTIN[key].cols()); return; }
  const m = MODELES.find(x => 'm' + x.id === key); if (!m) return;
  EX.mode = m.mode === 'Avec cotation' ? 'Avec cotation' : 'Sans cotation';
  let ks = []; try { ks = JSON.parse(m.colonnes || '[]'); } catch (e) { ks = []; }
  const ok = new Set(availCols(EX.mode).map(c => c.k)); EX.cols = new Set(ks.filter(k => ok.has(k)));
  try { const f = JSON.parse(m.format || '{}'); EX.fmt = { ...EX.fmt, ...f }; } catch (e) { /* format par défaut */ }
}
function setMode(m){ EX.mode = m; const ok = new Set(availCols(m).map(c => c.k)); EX.cols = new Set([...EX.cols].filter(k => ok.has(k))); EX.preset = ''; renderExport(); }
function toggleCol(k, on){ on ? EX.cols.add(k) : EX.cols.delete(k); EX.preset = ''; renderExportPreview(); markPreset(); }
function setGroup(g, on){ availCols(EX.mode).filter(c => c.g === g).forEach(c => on ? EX.cols.add(c.k) : EX.cols.delete(c.k)); EX.preset = ''; renderExport(); }
function setFmt(k, v){ EX.fmt[k] = v; renderExportPreview(); }
function toggleRow(id, on){ on ? EX.excluded.delete(id) : EX.excluded.add(id); renderExportPreview(); }
function setAllRows(on){ const ids = P.filter(p => matches(p, FE)).map(p => p.id); ids.forEach(id => on ? EX.excluded.delete(id) : EX.excluded.add(id)); renderExportBody(); }
function markPreset(){ const s = document.getElementById('ex-preset'); if (s) s.value = EX.preset; }

function cellText(col, p){
  let v = col.v(p);
  if (col.d) return v ? (EX.fmt.dateFr ? fmtDate(v) : isoDate(v)) : '';
  if (Array.isArray(v)) return v.join(EX.fmt.listSep);
  if (typeof v === 'number') return EX.fmt.decComma ? String(v).replace('.', ',') : String(v);
  if (typeof v === 'boolean') return v ? 'Oui' : 'Non';
  return v === null || v === undefined ? '' : String(v);
}
function exportRows(){ return P.filter(p => matches(p, FE) && !EX.excluded.has(p.id)).sort((a, b) => a.id - b.id); }
function selectedCols(){ return availCols(EX.mode).filter(c => EX.cols.has(c.k)); }
const csvEsc = (v, sep) => { const s = String(v ?? '').replace(/\r?\n/g, ' | '); return (s.includes(sep) || s.includes('"') || s.includes('\n')) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function downloadExport(){
  const cols = selectedCols(), rows = exportRows(), sep = EX.fmt.sep === 'tab' ? '\t' : EX.fmt.sep;
  if (!cols.length) { toast('Coche au moins une colonne.', true); return; }
  if (!rows.length) { toast('Aucune ligne à exporter.', true); return; }
  const head = cols.map(c => csvEsc(EX.fmt.headers === 'codes' ? c.k : c.l, sep)).join(sep);
  const body = rows.map(p => cols.map(c => csvEsc(cellText(c, p), sep)).join(sep));
  const csv = (EX.fmt.bom ? '\uFEFF' : '') + [head, ...body].join('\r\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' }), url = URL.createObjectURL(blob), a = document.createElement('a');
  const an = String(PARAMS.annee_cible || 'PNF').replace(/\s+/g, '');
  a.href = url; a.download = `PNF${an}_propositions_${EX.mode === 'Sans cotation' ? 'sans-cotation' : 'interne'}_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast(`${rows.length} proposition(s) exportée(s) — ${cols.length} colonne(s).`);
}

/* ----- modèles partagés ----- */
function presetOptions(){
  return `<optgroup label="Modèles standards">${Object.keys(BUILTIN).map(k => opt(k, BUILTIN[k].nom, EX.preset)).join('')}</optgroup>` +
    (MODELES.length ? `<optgroup label="Modèles partagés">${MODELES.map(m => opt('m' + m.id, m.nom, EX.preset)).join('')}</optgroup>` : '') + `<option value="" ${EX.preset === '' ? 'selected' : ''}>Sélection personnalisée</option>`;
}
function choosePreset(k){ if (!k) return; applyPreset(k); renderExport(); }
function modelPayload(){ return { colonnes: JSON.stringify([...EX.cols]), format: JSON.stringify(EX.fmt), mode: EX.mode, maj: Date.now() / 1000 }; }
async function saveModelAs(){
  const nom = clean(document.getElementById('ex-newname').value); if (!nom) { toast('Donne un nom au modèle.', true); return; }
  if (MODELES.some(m => norm(m.nom) === norm(nom)) || Object.values(BUILTIN).some(b => norm(b.nom) === norm(nom))) { toast('Ce nom existe déjà : choisis un autre nom ou mets à jour le modèle.', true); return; }
  try { await grist.docApi.applyUserActions([['AddRecord', MODELES_T, null, { nom, cree_par: '', ...modelPayload() }]]); await loadAll(); const m = MODELES.find(x => norm(x.nom) === norm(nom)); EX.preset = m ? 'm' + m.id : ''; renderExport(); toast('Modèle partagé enregistré.'); }
  catch (e) { console.error(e); toast('Échec : ' + (e.message || e), true); }
}
async function updateModel(){
  const m = MODELES.find(x => 'm' + x.id === EX.preset); if (!m) return;
  try { await grist.docApi.applyUserActions([['UpdateRecord', MODELES_T, m.id, modelPayload()]]); await loadAll(); renderExport(); toast('Modèle mis à jour.'); }
  catch (e) { console.error(e); toast('Échec : ' + (e.message || e), true); }
}
function askDeleteModel(){ const b = document.getElementById('ex-del'); b.outerHTML = '<span id="ex-del">Supprimer ce modèle partagé ? <button class="btn small danger" onclick="deleteModel()">Oui, supprimer</button> <button class="btn small" onclick="renderExport()">Annuler</button></span>'; }
async function deleteModel(){
  const m = MODELES.find(x => 'm' + x.id === EX.preset); if (!m) return;
  try { await grist.docApi.applyUserActions([['RemoveRecord', MODELES_T, m.id]]); await loadAll(); applyPreset('std-sans'); renderExport(); toast('Modèle supprimé.'); }
  catch (e) { console.error(e); toast('Échec : ' + (e.message || e), true); }
}

/* ----- rendu de l'onglet Export ----- */
function renderExport(){
  if (!EX.cols.size && EX.preset) applyPreset(EX.preset);
  const shared = EX.preset.startsWith('m'), avail = availCols(EX.mode), groups = [...new Set(avail.map(c => c.g))];
  document.getElementById('page').innerHTML = `
    <div class="panel"><h3>1. Modèle et destinataire</h3>
      <div class="row"><div class="fld" style="min-width:260px"><label>Modèle d'export</label><select id="ex-preset" onchange="choosePreset(this.value)">${presetOptions()}</select></div>
        <div class="fld"><label>Destinataire</label><div class="row" style="padding-top:5px">
          <label class="chk"><input type="radio" name="ex-mode" ${EX.mode === 'Sans cotation' ? 'checked' : ''} onchange="setMode('Sans cotation')">Sans cotation</label>
          <label class="chk"><input type="radio" name="ex-mode" ${EX.mode === 'Avec cotation' ? 'checked' : ''} onchange="setMode('Avec cotation')">Avec cotation (interne)</label></div></div></div>
      ${EX.mode === 'Sans cotation' ? '<div class="note" style="margin-top:8px">Mode « Sans cotation » : les notes, le détail de l\'évaluation et toutes les colonnes d\'instruction (statut, fusion, commentaires, motif) sont retirés de la liste des colonnes.</div>' : '<div class="warn" style="margin-top:8px">Mode « Avec cotation » : ce fichier contient des données internes. Il ne doit pas être transmis à la DGRH.</div>'}
      <div class="row" style="margin-top:10px">
        <input type="text" id="ex-newname" placeholder="Nom du nouveau modèle partagé" style="width:240px"><button class="btn small" onclick="saveModelAs()">Enregistrer sous ce nom</button>
        ${shared ? '<button class="btn small" onclick="updateModel()">Mettre à jour le modèle sélectionné</button><span id="ex-del"><button class="btn small danger" onclick="askDeleteModel()">Supprimer le modèle</button></span>' : ''}
        <span class="t-sub">Un modèle enregistre le mode, les colonnes cochées et le format ; il est partagé avec la chefferie et les propriétaires.</span></div></div>
    <details class="panel" open><summary>2. Lignes à exporter — filtres</summary>${filterPanel('e')}</details>
    <div class="panel"><h3>3. Colonnes à exporter</h3><div class="cols-grid">${groups.map(g => {
      const cs = avail.filter(c => c.g === g), n = cs.filter(c => EX.cols.has(c.k)).length;
      return `<div class="grp"><div class="grp-h"><b>${esc(g)} <span class="t-sub">(${n}/${cs.length})</span></b><span><button class="btn small" onclick="setGroup('${g.replace(/'/g, "\\'")}',true)">Tout</button> <button class="btn small" onclick="setGroup('${g.replace(/'/g, "\\'")}',false)">Aucun</button></span></div>
        <div class="cols-list">${cs.map(c => `<label class="chk"><input type="checkbox" ${EX.cols.has(c.k) ? 'checked' : ''} onchange="toggleCol('${c.k}',this.checked)">${esc(c.l)}</label>`).join('')}</div></div>`;
    }).join('')}</div></div>
    <div class="panel"><h3>4. Format du fichier</h3><div class="row">
      <div class="fld"><label>Séparateur</label><select onchange="setFmt('sep',this.value)">${opt(';', 'Point-virgule (Excel français)', EX.fmt.sep)}${opt(',', 'Virgule', EX.fmt.sep)}${opt('tab', 'Tabulation', EX.fmt.sep)}</select></div>
      <div class="fld"><label>En-têtes</label><select onchange="setFmt('headers',this.value)">${opt('labels', 'Libellés lisibles', EX.fmt.headers)}${opt('codes', 'Codes courts', EX.fmt.headers)}</select></div>
      <div class="fld"><label>Séparateur des listes</label><select onchange="setFmt('listSep',this.value)">${opt(' | ', 'Barre verticale ( | )', EX.fmt.listSep)}${opt('; ', 'Point-virgule + espace', EX.fmt.listSep)}${opt(', ', 'Virgule + espace', EX.fmt.listSep)}</select></div>
      <label class="chk" style="margin-top:16px"><input type="checkbox" ${EX.fmt.bom ? 'checked' : ''} onchange="setFmt('bom',this.checked)">UTF-8 avec BOM (accents dans Excel)</label>
      <label class="chk" style="margin-top:16px"><input type="checkbox" ${EX.fmt.dateFr ? 'checked' : ''} onchange="setFmt('dateFr',this.checked)">Dates JJ/MM/AAAA</label>
      <label class="chk" style="margin-top:16px"><input type="checkbox" ${EX.fmt.decComma ? 'checked' : ''} onchange="setFmt('decComma',this.checked)">Décimale avec virgule</label></div></div>
    <div id="ex-body"></div>`;
  renderExportBody();
}
function renderExportBody(){
  const body = document.getElementById('ex-body'); if (!body) return;
  const matching = P.filter(p => matches(p, FE)).sort((a, b) => a.id - b.id);
  body.innerHTML = `<div class="panel"><h3>5. Lignes retenues pour l'export</h3>
    <div class="row"><span id="ex-count" class="count"></span><button class="btn small" onclick="setAllRows(true)">Tout cocher</button><button class="btn small" onclick="setAllRows(false)">Tout décocher</button><span class="t-sub">Décoche une ligne pour l'exclure de l'export.</span></div>
    ${matching.length ? `<div class="tbl-wrap" style="margin-top:8px;max-height:260px;overflow-y:auto"><table class="t" style="min-width:560px"><thead><tr><th></th><th>N°</th><th>Titre</th><th>Structure</th><th>Action</th></tr></thead><tbody>${matching.map(p => `<tr><td><input type="checkbox" style="width:auto" ${EX.excluded.has(p.id) ? '' : 'checked'} onchange="toggleRow(${p.id},this.checked)"></td><td>${p.id}</td><td>${esc(p.Titre || 'Sans titre')}</td><td>${esc(sCode(refId(p.Structure_porteuse)))}</td><td>${refId(p.Action_SD) ? 'Action ' + esc(aNum(refId(p.Action_SD))) : '–'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty" style="padding:20px">Aucune proposition ne correspond aux filtres.</div>'}</div>
    <div class="panel"><h3>6. Aperçu</h3><div id="ex-preview"></div><div class="row" style="margin-top:10px"><button class="btn primary" id="ex-dl" onclick="downloadExport()">Télécharger le CSV</button></div></div>`;
  renderExportPreview();
}
function renderExportPreview(){
  const rows = exportRows(), cols = selectedCols(), c = document.getElementById('ex-count'), pv = document.getElementById('ex-preview'); if (!pv) return;
  document.getElementById('count').textContent = `${rows.length} ligne(s) · ${cols.length} colonne(s)`;
  if (c) c.textContent = `${rows.length} proposition(s) sélectionnée(s) sur ${P.length}`;
  const dl = document.getElementById('ex-dl'); if (dl) dl.disabled = !rows.length || !cols.length;
  if (!cols.length || !rows.length) { pv.innerHTML = `<div class="t-sub">${!cols.length ? 'Aucune colonne cochée.' : 'Aucune ligne à exporter.'}</div>`; return; }
  pv.innerHTML = `<div class="tbl-wrap"><table class="t" style="min-width:${Math.max(560, cols.length * 130)}px"><thead><tr>${cols.map(x => `<th>${esc(EX.fmt.headers === 'codes' ? x.k : x.l)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0, 5).map(p => `<tr>${cols.map(x => { const t = cellText(x, p); return `<td title="${esc(t)}">${esc(t.length > 90 ? t.slice(0, 90) + '…' : t)}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div><div class="t-sub" style="margin-top:4px">Aperçu des ${Math.min(5, rows.length)} premières lignes sur ${rows.length}.</div>`;
}

/* ============================== démarrage ============================== */
async function start(){
  showLoader(true);
  try {
    let n = 0; while (!grist.docApi && n < 20) { await new Promise(r => setTimeout(r, 100)); n++; }
    if (!(await checkAccess())) {
      document.getElementById('toolbar').style.display = 'none';
      document.getElementById('page').innerHTML = `<div class="empty"><p>Accès réservé</p><span>Cette page est réservée à la Chefferie et aux Propriétaires.</span></div>`; return;
    }
    await loadAll(); applyPreset('std-sans'); renderAll();
  } catch (e) { console.error(e); document.getElementById('page').innerHTML = `<div class="empty"><p>Erreur de chargement</p><span>${esc(e.message)}</span></div>`; }
  finally { showLoader(false); }
}
grist.ready({ requiredAccess:'full', columns:[] });
let _started = false;
grist.onRecords(() => { if (!_started) { _started = true; start(); } else scheduleReload(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && MODAL) closeModal(); });
</script>
