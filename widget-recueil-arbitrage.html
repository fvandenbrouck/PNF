<title>Recueil des besoins PNF — Arbitrage</title>
<!-- Version v1 : liste des propositions, fiche (déposé/corrigé, évaluation, instruction avec fusion, fiche de retour) et export CSV avec filtres, cases à cocher et modèles partagés -->
<!-- Version v2 : fusions en chaîne (une proposition principale peut elle-même être fusionnée) ; champs corrigeables ajoutés (adresse électronique, pluriannuelle, report) ; onglet Versement vers Actions_formation (contacts créés si absents, dates, volet, degrés, lieux) -->
<!-- Version v2.1 : libellés « catalogue des actions » (bouton Verser, messages) ; le dépassement du délai n'est plus rédhibitoire (réglage des critères dans Grist) -->
<!-- Version v2.2 : note de pertinence supprimée (note globale 100 % automatique, filtre « Pertinence à noter » retiré) ; la case « Incompatibilité constatée » est conservée -->
<!-- Version v2.3 : à la fusion, l'effectif et la durée de la proposition principale prennent le maximum des deux (et non plus leur somme) -->
<!-- Version v2.4 : champs texte corrigés nettoyés des espaces superflus ; message « Versement en cours » pendant le versement -->
<!-- Version v2.5 : fiche de retour supprimée (onglet, texte généré et bouton de copie) -->
<!-- Version v3.0 : modalité et format séparés (table Formats, questions Magistère/Mentor) : champs corrigeables, filtre et export du format, versement de id_format et des articulations vers le catalogue -->
<!-- Version v3.1 : articulation Magistère / Mentor : une seule question à trois choix (Magistère, Mentor, Ni l'un ni l'autre) à la place de deux questions Oui/Non -->
<!-- Version v3.2 : durée saisie en heures (colonnes Duree_heures / C_Duree_heures) ; journées stagiaires = effectif × heures / 6 (paramètre jour_heures) -->
<!-- Version v3.3 : la déclaration « document attestant le suivi » (Arr_attestation) est retirée de la liste des déclarations de l'arrêté -->
<!-- Version v3.4 : export CSV protégé contre l'injection de formules (cellule texte commençant par = + - @ préfixée d'une apostrophe) -->
<!-- Version v3.5 : polices auto-hébergées (dossier fonts/) et script plugin Grist servi par l'instance du ministère, plus aucune dépendance à Google ni à docs.getgrist.com -->
<!-- Version v3.6 : « Format » devient « Modalité pédagogique » dans les libellés (identifiants techniques inchangés) -->
<!-- Version v3.7 : « Orientations du schéma directeur » devient « Principes et orientations du schéma directeur » (fiche et export CSV) -->
<!-- Version v3.8 : démarrage sans attendre onRecords (table Propositions_PNF vide : le message « Aucune proposition reçue » s'affiche au lieu d'un chargement sans fin) -->
<!-- Version v3.9 : nombre prévisionnel de sessions de formation (colonnes Nb_sessions / C_Nb_sessions) : champ corrigeable et colonnes d'export -->
<!-- Version v3.10 : précision sur le public « Autres » (colonnes Public_autre / C_Public_autre) : champ corrigeable, alertes (« Autres » coché sans précision, précision sans « Autres »), reprise à la fusion, colonnes d'export -->
<!-- Version v3.11 : bac à sable du versement — paramètre mode_versement (Parametres_recueil) : « simulation » (défaut, y compris si le paramètre est absent) ou « reel ». En simulation, « Verser » n'écrit ni dans Actions_formation ni dans Contacts : seule la colonne Versement_simule de la proposition est posée (effaçable) ; bandeau « MODE TEST » -->
<!-- Version v3.12 : le choix du mode de versement (simulation / réel) n'est proposé qu'à l'Owner (sélecteur dans le bandeau, avec confirmation ; le passage en réel efface les marques de simulation) ; les autres profils voient seulement le bandeau « MODE TEST » -->
<!-- Version v3.13 : la classe DGRH accède à l'Arbitrage (évaluation, corrections, instruction, fusions, export avec ou sans cotation) ; le versement dans le catalogue et l'enregistrement de modèles d'export partagés lui restent fermés -->
<!-- Version v3.14 : gel du catalogue réservé à l'Owner — « Figer » marque toutes les propositions (colonnes Gele / Date_gel) qui passent en lecture seule (corrections, évaluation, instruction, fusions) ; le versement reste possible (seul le lien est écrit) ; « Dégeler » par l'Owner. La règle d'accès sur Gele, à poser dans Grist, rend le gel effectif hors du widget -->
<!-- Version v3.27 : consolidation — champs obligatoires pour enregistrer : volet, titre, objectifs, action du schéma directeur, structure porteuse (marqués d'un *, liste des champs manquants dans le message de refus) -->
<!-- Version v3.26 : consultation seule — sur une proposition où le profil n'a aucune procédure permise (hors périmètre, ou profil limité à Visualiser), la fiche n'affiche que la version déposée par le porteur (ni version consolidée, ni volet, ni analyse, ni instruction, ni versement) ; message de refus précisé quand le périmètre est bon mais que le droit manque -->
<!-- Version v3.25 : droits d'arbitrage pilotés par deux matrices stockées dans Grist, sans plus aucun périmètre en dur dans le code : « Droits_arbitrage » (profil, référence à Classe × Visualiser / Consolider / Instruire / Verser) et colonnes « Perimetre_<profil> » de la table Structures (structure × profil : affichage par défaut et lieu d'exercice des droits). L'accès à la page est gouverné par Visualiser, l'Owner a tous les droits, refus par défaut si le profil n'a pas de ligne. La DGRH instruit (retenir ou non, fusionner) dans son périmètre mais ne verse pas (case Verser décochée) : la restriction « retenir seulement » de la v3.24 disparaît. Un nouveau profil s'ajoute sans toucher au code -->
<!-- Version v3.24 : la DGRH se limite à consolider et à retenir, dans son périmètre : onglet Instruction réduit au statut (choix limité au statut courant et à « Retenue »), sans commentaire, motif, fusion ni défusion ; onglet Versement toujours masqué -->
<!-- Version v3.23 : la DGRH n'a plus accès au versement : l'onglet Versement est masqué pour elle et les fonctions de versement (simulation, effacement, versement) sont refusées ; elle conserve l'instruction (statut, commentaire, fusions) dans son périmètre -->
<!-- Version v3.22 : consolidation — l'action du schéma directeur est obligatoire pour enregistrer (comme le volet) -->
<!-- Version v3.21 : consolidation — l'axe n'est plus un menu indépendant : seule l'action se choisit (liste groupée par axe) et l'axe qui s'en déduit est affiché -->
<!-- Version v3.20 : onglet Dépôt/Consolidation — menu « Volet de rattachement » (colonne Propositions_PNF.Volet, Ref:Volets) ; mention obligatoire : l'enregistrement des corrections est refusé tant que le volet n'est pas choisi ; au versement, le volet consolidé est présélectionné (modifiable) -->
<!-- Version v3.19 : la consolidation (onglet Dépôt/Consolidation) suit le même périmètre que l'instruction : hors périmètre, la version consolidée est affichée en lecture seule (champs, boutons Rétablir et Enregistrer retirés) ; les Responsables de suivi consolident dans le périmètre de la Chefferie (1 à 35 et 50) -->
<!-- Version v3.18 : onglets Instruction et Versement réservés à la Chefferie, à la DGRH (et à l'Owner / Proprietaire) — invisibles pour les Responsables de suivi ; instruire, fusionner et verser limités par la structure porteuse (identifiants de la table Structures) : Chefferie = 1 à 35 et 50 (Dgesco, IGESR, DNE, DNE TN1), DGRH = 36 à 55 sauf 38, 39, 40 et 50 ; affichage par défaut : Chefferie et Responsables de suivi = 1 à 35 et 50, DGRH = 36 à 55 sauf 38, 39, 40 et 50 (les autres structures par le menu « Structure porteuse ») ; le périmètre ne dépend plus du code de la structure -->
<!-- Version v3.17 : filtre « Note globale » et tris par note retirés de la liste ; la colonne Propositions_PNF.Score_global est supprimée du document (plus aucune lecture de la note globale par le widget) -->
<!-- Version v3.16 : fiche d'une proposition — onglet « Déposé / corrigé » renommé « Dépôt/Consolidation » (colonnes « Version déposée » / « Version consolidée ») ; onglet « Évaluation » renommé « Analyse » : message d'introduction, plus de note globale, de notes par bloc ni de pondérations, plus de case « Incompatibilité » ; seules les trois barres Complétude, Conformité et Alignement au schéma directeur sont conservées (guide d'amélioration, non chiffré) -->
<!-- Version v3.15 : export CSV supprimé (redondant avec la vue Export DGRH : onglet, modèles partagés, code) ; liste des propositions réduite à N° / Déposée / Titre / Structure / Axe / Action / Statut (colonnes Cotation et Note retirées) ; accès ouvert à la classe Responsable_suivi comme à la Chefferie ; la DGRH a le même accès que la Chefferie (versement compris, qui lui était fermé en v3.13) ; Chefferie, Responsables de suivi et DGRH ne voient par défaut que les propositions des structures DGESCO, IGESR et DNE (les autres s'affichent en les choisissant dans le menu « Structure porteuse »), l'Owner voit tout -->

<style>

.fld > label { font-size:10px; font-weight:700; color:var(--ink3); text-transform:uppercase; letter-spacing:.05em; }
input[type=text], input[type=number], input[type=date], select, textarea { font-family:'DM Sans',sans-serif; font-size:12px; color:var(--ink)!important; -webkit-text-fill-color:var(--ink)!important; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:7px 9px; outline:none; width:100%; }
textarea { min-height:90px; resize:vertical; line-height:1.5; }
input:focus, select:focus, textarea:focus { border-color:var(--navy); background:#fff; }

input, select, textarea, button { color-scheme:light; }
.chk { display:flex; align-items:center; gap:6px; font-size:12px; cursor:pointer; }

.btn.danger:hover { border-color:var(--danger); }
.btn.small { padding:5px 9px; font-size:11px; }

/* tableau */
.tbl-wrap { overflow-x:auto; border:1.5px solid var(--border); border-radius:12px; background:var(--white); }
table.t { border-collapse:collapse; width:100%; min-width:760px; }
table.t th { text-align:left; font-family:'DM Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink3); padding:9px 10px; border-bottom:1px solid var(--border); background:var(--bg); position:sticky; top:0; }
table.t td { padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top; font-size:12px; }
table.t tbody tr.clickable { cursor:pointer; }
table.t tbody tr.clickable:hover { background:var(--navy-l); }
.t-title { font-family:'Fraunces',serif; font-size:13.5px; font-weight:600; line-height:1.3; }
.t-sub { font-size:10.5px; color:var(--ink3); margin-top:2px; }
.chip { font-family:'DM Mono',monospace; font-size:9px; font-weight:700; padding:3px 8px; border-radius:4px; text-transform:uppercase; letter-spacing:.05em; white-space:nowrap; display:inline-block; }
.st-Reçue { background:var(--lilas); color:var(--navy); }
.st-En-cours { background:rgba(249,197,154,.45); color:#8a4a10; }
.st-Retenue { background:var(--ok-l); color:var(--ok); }

.st-Fusionnée { background:#ece7dd; color:var(--ink2); }
.flag { font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; margin-left:4px; }
.flag.bad { background:var(--danger-l); color:var(--danger); }
.flag.good { background:var(--ok-l); color:var(--ok); }
.mode-test { background:#FFF3CD; color:#7A5A00; border-bottom:2px solid #E0B94A; padding:7px 16px; font-size:12px; font-weight:600; }
.mode-test.hidden { display:none; }
.gel-bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; background:#E8F0FB; color:#1F3F73; border-bottom:2px solid #9DB7E3; padding:7px 16px; font-size:12px; font-weight:600; }
.gel-bar.on { background:#DCE8FA; }
.gel-bar.hidden { display:none; }
.gel-bar .btn { font-size:11.5px; padding:3px 8px; width:auto; }
.gel-note { background:#E8F0FB; color:#1F3F73; border-radius:8px; padding:8px 10px; font-size:11.5px; margin-bottom:10px; }
.mode-test.reel { background:var(--ok-l); color:var(--ok); border-bottom-color:var(--ok); }
.mode-test { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; }
.mode-test select, .mode-test .btn { font-size:11.5px; padding:3px 6px; width:auto; }
.flag.test { background:#FFF3CD; color:#7A5A00; }
.gauge { height:8px; background:#ece7dd; border-radius:4px; overflow:hidden; min-width:54px; }
.gauge > i { display:block; height:100%; border-radius:4px; }
.g-row { display:flex; align-items:center; gap:8px; margin:3px 0; }
.g-row .g-l { min-width:210px; font-size:12px; }
.g-row .g-n { font-family:'DM Mono',monospace; font-size:11px; min-width:44px; text-align:right; }
.g-row .gauge { flex:1; height:11px; }
.mini { display:grid; gap:3px; min-width:96px; }
.mini .gauge { height:5px; }
.big-n { font-family:'Fraunces',serif; font-size:17px; font-weight:700; }
.empty { text-align:center; padding:60px 20px; color:var(--ink3); }
.empty p { font-family:'Fraunces',serif; font-size:22px; margin-bottom:8px; }
/* modale */
.overlay { position:fixed; inset:0; background:rgba(27,58,107,.45); backdrop-filter:blur(3px); z-index:200; display:flex; align-items:flex-start; justify-content:center; padding:20px; overflow-y:auto; }
.overlay.hidden { display:none; }
.modal { background:var(--white); border-radius:15px; width:100%; max-width:1020px; display:flex; flex-direction:column; box-shadow:0 24px 64px rgba(27,58,107,.25); margin:auto 0; }
.modal-head { padding:16px 22px 12px; border-bottom:1px solid var(--border); display:flex; gap:12px; align-items:flex-start; }
.modal-head h2 { font-family:'Fraunces',serif; font-size:19px; line-height:1.3; }
.modal-meta { font-family:'DM Mono',monospace; font-size:10px; color:var(--ink3); margin-top:5px; letter-spacing:.04em; }
.btn-close { margin-left:auto; border:none; background:transparent; font-size:24px; color:var(--ink3); cursor:pointer; padding:2px 6px; }

.modal-body { padding:16px 22px 22px; }
.pane { display:none; gap:14px; }

.cmp .dep { font-size:12px; color:var(--ink2); background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:7px 9px; white-space:pre-wrap; line-height:1.5; }
.mod-flag { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--strawberry); margin-left:6px; vertical-align:middle; }
.box { border:1.5px solid var(--border); border-radius:9px; background:var(--bg); padding:10px 12px; font-size:12px; line-height:1.55; }
.pub-list { max-height:150px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; background:var(--bg); padding:6px 8px; display:grid; gap:2px; }

.warn { background:var(--danger-l); color:var(--danger); border-radius:8px; padding:8px 10px; font-size:11.5px; }
.note { background:var(--ok-l); color:var(--ok); border-radius:8px; padding:8px 10px; font-size:11.5px; }
.grp { border:1px solid var(--border); border-radius:10px; padding:8px 10px; background:var(--white); }

.grp-h b { font-size:12px; color:var(--navy); }
.vs-sum { display:grid; grid-template-columns:170px 1fr; gap:4px 12px; font-size:12px; }
.vs-sum dt { color:var(--ink3); font-family:'DM Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:.06em; padding-top:3px; }

.chk-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:3px 12px; }

#toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:10px; font-size:12px; z-index:600; opacity:0; pointer-events:none; transition:.2s; max-width:90vw; }
#toast.show { opacity:1; } #toast.err { background:var(--danger); }
#loader { position:fixed; inset:0; background:rgba(247,245,242,.92); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; z-index:500; }

.spinner { width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--navy); border-radius:50%; animation:spin .7s linear infinite; }

@media (max-width:760px) {
  .toolbar { position:static; align-items:stretch; }
  .cmp { grid-template-columns:1fr; } .cmp .h { display:none; }
  .crit { grid-template-columns:22px 1fr; } .crit .src { display:none; } .crit .m { grid-column:2; }
  .g-row .g-l { min-width:120px; }
}
</style>

<body>
<div class="toolbar" id="toolbar">
  <span class="count" id="count">–</span>
</div>
<div class="mode-test hidden" id="mode-banner">MODE TEST — le versement dans le catalogue des actions est simulé : rien n'est écrit dans Actions_formation ni dans Contacts.</div>
<div class="gel-bar hidden" id="gel-banner"></div>
<div class="page" id="page"></div>
<div id="loader"><div class="spinner"></div><p>Chargement des propositions…</p></div>
<div class="overlay hidden" id="overlay" onmousedown="overlayDown(event)">
  <div class="modal" id="modal"></div>
</div>
<div id="toast"></div>
<script>
console.info('[widget-recueil-arbitrage] v3.27 champs obligatoires de la consolidation chargés');

/* ============================== constantes ============================== */
const PROP = 'Propositions_PNF';
const STATUTS = ['Reçue', "En cours d'instruction", 'Retenue', 'Refusée', 'Fusionnée'];
const PERIODES_DEFAUT = ['Septembre - décembre 2027', 'Janvier - mars 2028', 'Avril - juin 2028', "Au fil de l'année"];
const PARCOURS = ['Magistère', 'Mentor', "Ni l'un ni l'autre"];
const ARR = [['Arr_besoins','Évaluation préalable des besoins (art. 2)'],['Arr_apports','Apports théoriques et pratiques (art. 2, 1°)'],['Arr_activite','Séquences de mise en activité (art. 2, 2°)'],['Arr_acquis','Évaluation des acquis (art. 2, 3°)'],['Arr_prerequis','Prérequis précisés (art. 3, 2°)'],['Arr_programme','Programme et séquencement (art. 3, 4° et 5°)']];

/* ============================== état ============================== */
let P = [], STRUCT = {}, AXE = {}, ACTION = {}, MODALITE = {}, FORMAT = {}, PUBLIC = {}, ANNEE = {}, CRIT = [], PARAMS = {}, PERIODES = PERIODES_DEFAUT.slice();
let CONTACTS = [], VOLETS = {}, DEGRES = {}, LIEUX = {}, AF = [], VERSING = false, IS_OWNER = false, RESTRICT = false, PROFIL = '', CLS = '', DROITS = {}, CLASSE = {}, GEL_ASK = '', MODE_ROW = 0, MODE_ASK = '';
let REPCOL = 'Report_d_une_action_prevue_initialement_au_PNF_de_l_annee_N_1';
let SORT = 'date_desc', MODAL = null, RELOAD_TIMER = null;
const newF = () => ({ q:'', statuts:new Set(), axe:'', action:'', structure:'', modalite:'', format:'', periode:'', du:'', au:'', rouge:false, versees:'' });
let FL = newF();

/* ============================== utilitaires ============================== */
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm = s => String(s || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const clean = s => String(s ?? '').replace(/\s+/g, ' ').trim();
function toRows(t){ return (t && t.id || []).map((id,i) => { const r = { id }; Object.keys(t).forEach(k => { if (k !== 'id') r[k] = t[k][i]; }); return r; }); }
function decode(v){
  if (Array.isArray(v) && v.length) {
    if (v[0] === 'O' && v[1] && typeof v[1] === 'object') { const o = {}; Object.keys(v[1]).forEach(k => o[k] = decode(v[1][k])); return o; }
    if (v[0] === 'L') return v.slice(1).map(decode);
    if (v[0] === 'E') return null;
  }
  return v;
}
function asIds(v){ if (v == null || v === '' || v === 0) return []; if (Array.isArray(v)) return (v[0] === 'L' ? v.slice(1) : v).map(Number).filter(n => n > 0); const n = Number(v); return n > 0 ? [n] : []; }
const refId = v => { const a = asIds(v); return a.length ? a[0] : 0; };
const num = v => (v === null || v === undefined || v === '' ? null : (Number.isFinite(Number(v)) ? Number(v) : null));
const fmtN = (n, d = 1) => (n === null || n === undefined ? '–' : (Math.round(n * 10 ** d) / 10 ** d).toString().replace('.', ','));
function toDate(v){ if (v === null || v === undefined || v === '') return null; const ms = v > 20000000000 ? v : v * 1000; const d = new Date(ms); return isNaN(d.getTime()) ? null : d; }
const fmtDate = v => { const d = toDate(v); return d ? d.toLocaleDateString('fr-FR') : ''; };
const isoDate = v => { const d = toDate(v); return d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` : ''; };
function toast(msg, err){ const t = document.getElementById('toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : ''); clearTimeout(toast._t); toast._t = setTimeout(() => t.className = '', err ? 6000 : 2800); }
const showLoader = v => document.getElementById('loader').classList.toggle('hidden', !v);

/* ============================== libellés ============================== */
const sCode = id => STRUCT[id] ? STRUCT[id].code : '';
const sFull = id => STRUCT[id] ? `${STRUCT[id].code} — ${clean(STRUCT[id].libelle)}` : '';
const aLib = id => ACTION[id] ? clean(ACTION[id].libelle) : '';
const aNum = id => ACTION[id] ? ACTION[id].num_action : '';
const axeOf = aid => ACTION[aid] ? ACTION[aid].id_axe : 0;
const axeLib = aid => { const x = AXE[axeOf(aid)]; return x ? clean(x.libelle) : ''; };
const modLib = id => MODALITE[id] ? clean(MODALITE[id].libelle) : '';
const fmtLib = id => FORMAT[id] ? clean(FORMAT[id].libelle) : '';
const pubLibs = v => asIds(v).map(id => PUBLIC[id] ? clean(PUBLIC[id].libelle) : '').filter(Boolean);
/* Public « Autres » : la précision n'a de sens que si le public « Autres » est coché (repéré par son libellé, pas par son identifiant). */
const pubAutreIds = () => Object.values(PUBLIC).filter(x => norm(clean(x.libelle)) === 'autres').map(x => Number(x.id));
function autreState(p){
  const ids = asIds(p.C_Publics ?? p.Public_cible), autres = pubAutreIds();
  const coche = ids.some(i => autres.includes(i)), prec = String(p.C_Public_autre ?? p.Public_autre ?? '').trim();
  return { coche, prec, manque: coche && !prec, orpheline: !coche && !!prec };
}
function autreMsg(p){
  const a = autreState(p);
  return a.manque ? 'Le public « Autres » est retenu sans précision : demander au porteur de préciser le public concerné (ou le compléter ici).'
    : a.orpheline ? 'Une précision sur le public « Autres » est renseignée alors que « Autres » n\'est pas retenu : elle est ignorée à l\'export et au versement.' : '';
}
const statutOf = p => p.Statut_instruction || 'Reçue';
const stClass = s => 'st-' + (s === "En cours d'instruction" ? 'En-cours' : s);
const jourHeures = () => num(PARAMS.jour_heures) || 6;
function ev(p){ if (p._ev === undefined) { const e = decode(p.Evaluation); p._ev = (e && typeof e === 'object' && !Array.isArray(e)) ? e : null; } return p._ev; }
const isRouge = p => p.Redhibitoire === true;
const isVersee = p => refId(p.Id_action_creee) > 0;
const modeSimulation = () => !['reel'].includes(norm(PARAMS.mode_versement));     // tout sauf « reel » / « réel » vaut simulation (repli sûr)
const isGele = p => p.Gele === true;
const isSimulee = p => modeSimulation() && num(p.Versement_simule) > 0;
const fusionDans = p => refId(p.Fusionnee_dans);
const fusionnees = id => P.filter(x => fusionDans(x) === id);               // fusionnées directement dans id
function descendants(id, seen = new Set()){                                  // toutes les fusionnées, à tous les niveaux
  const out = [];
  fusionnees(id).forEach(k => { if (seen.has(k.id)) return; seen.add(k.id); out.push(k, ...descendants(k.id, seen)); });
  return out;
}
function racine(p){                                                          // proposition principale « de tête » d'un groupe fusionné
  let cur = p, n = 0;
  while (fusionDans(cur) && n++ < 50) { const up = P.find(x => x.id === fusionDans(cur)); if (!up) break; cur = up; }
  return cur;
}
const groupeVerse = p => isVersee(racine(p));
function gaugeColor(s){ const v = Math.max(0, Math.min(10, s || 0)); return `hsl(${Math.round(v * 12)},62%,45%)`; }
function gauge(s){ return `<div class="gauge"><i style="width:${s === null || s === undefined ? 0 : Math.max(0, Math.min(10, s)) * 10}%;background:${gaugeColor(s)}"></i></div>`; }
const cEff = p => (p.C_Effectif_previsionnel ?? p.Effectif_previsionnel);
const cDuree = p => (p.C_Duree_heures ?? p.Duree_heures);

/* ============================== chargement ============================== */
async function fetchRows(t){ try { return toRows(await grist.docApi.fetchTable(t)); } catch (e) { console.warn('[arbitrage] lecture impossible :', t, e); return []; } }
async function loadAll(){
  const [props, structs, axes, acts, mods, pubs, annees, crit, params, contacts, volets, degres, lieux, formats, droits, classes] = await Promise.all([
    fetchRows(PROP), fetchRows('Structures'), fetchRows('Axes'), fetchRows('Actions_axes'), fetchRows('Modalites'), fetchRows('Publics'), fetchRows('Annees'), fetchRows('Criteres_evaluation'), fetchRows('Parametres_recueil'),
    fetchRows('Contacts'), fetchRows('Volets'), fetchRows('Degres'), fetchRows('Lieux'), fetchRows('Formats'), fetchRows('Droits_arbitrage'), fetchRows('Classe')
  ]);
  AF = await fetchRows('Actions_formation');
  CONTACTS = contacts; VOLETS = Object.fromEntries(volets.map(r => [r.id, r])); DEGRES = Object.fromEntries(degres.map(r => [r.id, r])); FORMAT = Object.fromEntries(formats.map(r => [r.id, r])); LIEUX = Object.fromEntries(lieux.map(r => [r.id, r]));
  P = props; STRUCT = Object.fromEntries(structs.map(r => [r.id, r])); AXE = Object.fromEntries(axes.map(r => [r.id, r]));
  ACTION = Object.fromEntries(acts.map(r => [r.id, r])); MODALITE = Object.fromEntries(mods.map(r => [r.id, r])); PUBLIC = Object.fromEntries(pubs.map(r => [r.id, r]));
  ANNEE = Object.fromEntries(annees.map(r => [r.id, r])); CRIT = crit; PARAMS = Object.fromEntries(params.map(r => [r.cle, r.valeur])); MODE_ROW = (params.find(r => r.cle === 'mode_versement') || {}).id || 0;
  CLASSE = Object.fromEntries(classes.map(r => [r.id, r.Type]));
  DROITS = {}; droits.forEach(r => { const t = CLASSE[refId(r.Profil)] || (typeof r.Profil === 'string' && isNaN(Number(r.Profil)) ? r.Profil : ''); if (t) DROITS[t] = { Visualiser: r.Visualiser === true, Consolider: r.Consolider === true, Instruire: r.Instruire === true, Verser: r.Verser === true }; });
  if (P.length) { const k = Object.keys(P[0]).find(x => x.startsWith('Report')); if (k) REPCOL = k; }
  const used = [...new Set(P.map(p => p.Periode).filter(Boolean))];
  PERIODES = [...new Set([...PERIODES_DEFAUT, ...used])];
  try { // choix de la colonne Periode (si les métadonnées sont lisibles)
    const tabs = toRows(await grist.docApi.fetchTable('_grist_Tables')); const tid = (tabs.find(t => t.tableId === PROP) || {}).id;
    const cols = toRows(await grist.docApi.fetchTable('_grist_Tables_column')); const c = cols.find(x => x.parentId === tid && x.colId === 'Periode');
    const ch = c && JSON.parse(c.widgetOptions || '{}').choices; if (ch && ch.length) PERIODES = [...new Set([...ch, ...used])];
  } catch (e) { /* repli sur les valeurs par défaut */ }
}
async function reload(){ await loadAll(); renderAll(); }
function scheduleReload(){ clearTimeout(RELOAD_TIMER); RELOAD_TIMER = setTimeout(async () => { await loadAll(); renderAll(false); }, 350); }

/* ============================== accès ============================== */
// Garde-fou d'affichage (la vraie barrière reste l'ACL) : Utilisateurs n'est lisible en entier que par Owner et Chefferie.
// Matrices des droits d'arbitrage, lues dans Grist (garde-fous d'affichage du widget ; la vraie barrière reste l'ACL) :
//  - « Droits_arbitrage » (profil × procédure : Visualiser, Consolider, Instruire, Verser) ;
//  - colonnes « Perimetre_<profil> » de la table Structures (structure × profil) : affichage par défaut, et lieu où le profil peut consolider, instruire, verser.
// L'Owner a tous les droits ; un non-Owner sans ligne dans la matrice n'a aucun droit (refus par défaut).
const droit = op => IS_OWNER || !!(DROITS[PROFIL] && DROITS[PROFIL][op]);
const perim = p => { if (IS_OWNER) return true; const id = refId(p.Structure_porteuse); return !!id && !!STRUCT[id] && STRUCT[id]['Perimetre_' + PROFIL] === true; };
const permis = (op, p) => droit(op) && perim(p);
const isDefStruct = p => IS_OWNER || !refId(p.Structure_porteuse) || perim(p);   // sans structure : visible par défaut, pour ne pas être perdue
const canTabs = () => droit('Instruire');                                       // onglet Instruction
const canVerse = () => droit('Verser');                                         // onglet Versement
const canInstruct = p => permis('Instruire', p);
const canConsolidate = p => permis('Consolider', p);
// Consultation seule : aucune procédure (consolider, instruire, verser) n'est permise sur cette proposition → la fiche n'affiche que la version déposée par le porteur.
const consultation = p => !IS_OWNER && !permis('Consolider', p) && !permis('Instruire', p) && !permis('Verser', p);
const horsPerimetre = (p, verbe) => perim(p) ? `<div class="warn">Votre profil n'est pas autorisé à ${verbe} (table « Droits_arbitrage »).</div>` : refId(p.Structure_porteuse)
  ? `<div class="warn">Cette proposition est portée par « ${esc(sCode(refId(p.Structure_porteuse)))} », hors du périmètre de votre profil (colonne « Périmètre — ${esc(PROFIL)} » de la table Structures) : vous ne pouvez ${verbe} que les propositions des structures de votre périmètre.</div>`
  : `<div class="warn">Cette proposition n'a pas de structure porteuse : elle ne relève d'aucun périmètre (seul l'Owner peut agir dessus).</div>`;
const visible = p => !RESTRICT || isDefStruct(p) || (!!FL.structure && String(refId(p.Structure_porteuse)) === FL.structure);
async function checkAccess(){
  try {
    const rows = toRows(await grist.docApi.fetchTable('Utilisateurs'));
    if (rows.length > 1) return true;           // Owner ou Chefferie (seuls à lire toute la table) : CLS reste vide, l'Owner est reconnu ensuite par detectOwner
    if (rows.length === 1) { CLS = rows[0].ClasseNom || ''; return !!CLS; }          // l'accès à la page est ensuite décidé par la matrice (Visualiser)
    return false;
  } catch (e) { console.warn('[arbitrage] vérification des droits impossible :', e); return false; }
}

/* ============================== mode de versement (réservé à l'Owner) ============================== */
// Parametres_recueil n'est modifiable que par l'Owner (ACL) : une écriture sans changement n'aboutit que pour lui.
// Le sélecteur n'est proposé qu'à l'Owner ; la vraie barrière reste la règle d'accès de la table.
async function detectOwner(){
  if (!MODE_ROW) return false;
  try { await grist.docApi.applyUserActions([['UpdateRecord', 'Parametres_recueil', MODE_ROW, { valeur: String(PARAMS.mode_versement ?? '') }]]); return true; }
  catch (e) { return false; }
}
const nbSimul = () => P.filter(p => num(p.Versement_simule) > 0).length;
function renderModeBar(){
  const el = document.getElementById('mode-banner'); if (!el) return;
  const sim = modeSimulation();
  if (!IS_OWNER && (!sim || !MODE_ROW)) { el.className = 'mode-test hidden'; el.innerHTML = ''; return; }   // sans lecture de Parametres_recueil (règle non posée) : mode inconnu, bandeau masqué
  el.className = 'mode-test' + (sim ? '' : ' reel');
  let h = `<span>${sim ? 'MODE TEST — le versement dans le catalogue des actions est simulé : rien n\'est écrit dans Actions_formation ni dans Contacts.' : 'Versement réel — les actions retenues sont créées dans le catalogue des actions.'}</span>`;
  if (IS_OWNER) {
    if (MODE_ASK) { const n = nbSimul();
      h += `<span>${MODE_ASK === 'reel' ? 'Passer en versement RÉEL ?' + (n ? ` Les ${n} marque(s) de simulation seront effacées.` : '') : 'Repasser en simulation ?'}</span><button class="btn primary" onclick="setModeVersement('${MODE_ASK}')">Confirmer</button><button class="btn" onclick="MODE_ASK='';renderModeBar()">Annuler</button>`; }
    else h += `<label>Mode du versement (Owner) : <select onchange="MODE_ASK=this.value;renderModeBar()"><option value="simulation"${sim ? ' selected' : ''}>Simulation</option><option value="reel"${sim ? '' : ' selected'}>Réel</option></select></label>`;
  }
  el.innerHTML = h;
}
async function setModeVersement(v){
  if (!IS_OWNER || !MODE_ROW || !['simulation', 'reel'].includes(v)) { MODE_ASK = ''; renderModeBar(); return; }
  try {
    await grist.docApi.applyUserActions([['UpdateRecord', 'Parametres_recueil', MODE_ROW, { valeur: v }]]);
    if (v === 'reel') { const acts = P.filter(p => num(p.Versement_simule) > 0).map(p => ['UpdateRecord', PROP, p.id, { Versement_simule: null }]); if (acts.length) await grist.docApi.applyUserActions(acts); }
    MODE_ASK = ''; await loadAll(); renderAll();
    toast(v === 'reel' ? 'Mode réel activé : « Verser » crée désormais les actions dans le catalogue.' : 'Mode simulation activé.');
  } catch (e) { MODE_ASK = ''; renderModeBar(); toast('Changement de mode refusé : ' + (e.message || e), true); }
}

/* ============================== gel du catalogue (réservé à l'Owner) ============================== */
const NON_ARBITREES = ['Reçue', "En cours d'instruction"];
function renderGelBar(){
  const el = document.getElementById('gel-banner'); if (!el) return;
  const N = P.length, G = P.filter(isGele), nG = G.length;
  if ((!nG && !IS_OWNER) || (!nG && !N)) { el.className = 'gel-bar hidden'; el.innerHTML = ''; return; }
  el.className = 'gel-bar' + (nG ? ' on' : '');
  const d = nG ? fmtDate(Math.max(...G.map(p => num(p.Date_gel) || 0))) : '';
  let h = nG ? `<span>🔒 Catalogue figé le ${esc(d)} : ${nG} proposition(s) sur ${N} en lecture seule (le versement reste possible).${nG < N ? ' ' + (N - nG) + ' non figée(s) (déposée(s) après le gel).' : ''}</span>` : '<span>Catalogue non figé : toutes les propositions sont modifiables.</span>';
  if (IS_OWNER) {
    if (GEL_ASK) {
      const reste = P.filter(p => !isGele(p)), nonArb = reste.filter(p => NON_ARBITREES.includes(statutOf(p))).length;
      h += GEL_ASK === 'figer'
        ? `<span>Figer ${reste.length} proposition(s)${nonArb ? ` (dont ${nonArb} non arbitrée(s))` : ''} ? Plus aucune correction, instruction ni fusion tant que l'Owner n'a pas dégelé.</span><button class="btn primary" onclick="doGel('figer')">Confirmer le gel</button>`
        : `<span>Dégeler ${nG} proposition(s) ? Elles redeviennent modifiables.</span><button class="btn primary" onclick="doGel('degeler')">Confirmer le dégel</button>`;
      h += '<button class="btn" onclick="GEL_ASK=\'\';renderGelBar()">Annuler</button>';
    } else {
      if (nG < N) h += `<button class="btn" onclick="GEL_ASK='figer';renderGelBar()">${nG ? 'Figer les ' + (N - nG) + ' restantes' : 'Figer le catalogue (' + N + ')'}</button>`;
      if (nG) h += '<button class="btn" onclick="GEL_ASK=\'degeler\';renderGelBar()">Dégeler</button>';
    }
  }
  el.innerHTML = h;
}
async function doGel(v){
  if (!IS_OWNER || !['figer', 'degeler'].includes(v)) { GEL_ASK = ''; renderGelBar(); return; }
  try {
    const ids = (v === 'figer' ? P.filter(p => !isGele(p)) : P.filter(isGele)).map(p => p.id);
    if (!ids.length) { GEL_ASK = ''; renderGelBar(); return; }
    const now = Math.floor(Date.now() / 1000), on = v === 'figer';
    await grist.docApi.applyUserActions([['BulkUpdateRecord', PROP, ids, { Gele: ids.map(() => on), Date_gel: ids.map(() => on ? now : null) }]]);
    GEL_ASK = ''; await loadAll();
    const bad = P.filter(p => ids.includes(p.id) && isGele(p) !== on).length;
    renderAll();
    bad ? toast(`${bad} proposition(s) non ${on ? 'figée(s)' : 'dégelée(s)'} : vérifie les droits et recharge.`, true) : toast(on ? `Catalogue figé : ${ids.length} proposition(s).` : `Catalogue dégelé : ${ids.length} proposition(s).`);
  } catch (e) { GEL_ASK = ''; renderGelBar(); toast('Échec : ' + (e.message || e), true); }
}
const GEL_MSG = 'Proposition figée : modification impossible (seul l\'Owner peut dégeler le catalogue).';

}

/* ============================== filtres ============================== */
function matches(p, f){
  const act = refId(p.Action_SD);
  if (RESTRICT && !f.structure && !isDefStruct(p)) return false;
  if (f.q && !norm([p.id, p.Titre, p.Email_contact, sCode(refId(p.Structure_porteuse)), p.Objectifs].join(' ')).includes(norm(f.q))) return false;
  if (f.statuts.size && !f.statuts.has(statutOf(p))) return false;
  if (f.axe && String(axeOf(act)) !== f.axe) return false;
  if (f.action && String(act) !== f.action) return false;
  if (f.structure && String(refId(p.Structure_porteuse)) !== f.structure) return false;
  if (f.modalite && String(refId(p.Modalite)) !== f.modalite) return false;
  if (f.format && String(refId(p.Format)) !== f.format) return false;
  if (f.periode && p.Periode !== f.periode) return false;
  const d = isoDate(p.Date_depot);
  if (f.du && !(d && d >= f.du)) return false;
  if (f.au && !(d && d <= f.au)) return false;
  if (f.rouge && !isRouge(p)) return false;
  if (f.versees === 'oui' && !isVersee(p)) return false;
  if (f.versees === 'non' && isVersee(p)) return false;
  return true;
}

    <div class="fld"><label>Modalité pédagogique</label><select onchange="setF('format',this.value)"><option value="">Tous</option>${Object.values(FORMAT).map(m => opt(m.id, clean(m.libelle), f.format)).join('')}</select></div>

    <div class="fld"><label>Déposée du / au</label><div class="row"><input type="date" style="width:128px" value="${esc(f.du)}" onchange="setF('du',this.value)"><input type="date" style="width:128px" value="${esc(f.au)}" onchange="setF('au',this.value)"></div></div>
  </div>
  <div class="row" style="margin-top:10px"><span class="section-title" style="margin:0">Statut</span>${STATUTS.map(s => `<label class="chk"><input type="checkbox" ${f.statuts.has(s) ? 'checked' : ''} onchange="toggleStatut('${s.replace(/'/g, "\\'")}',this.checked)">${esc(s)}</label>`).join('')}</div>
  <div class="row" style="margin-top:8px">

/* ----- écriture avec relecture ----- */
async function writeFields(id, fields, okMsg){
  if (isGele(P.find(x => x.id === id) || {})) { toast(GEL_MSG, true); return false; }
  try {
    await grist.docApi.applyUserActions([['UpdateRecord', PROP, id, fields]]);
    await loadAll();
    const p = P.find(x => x.id === id); const bad = [];
    Object.keys(fields).forEach(k => { const f = EDITS.find(x => x.c === k) || { t: Array.isArray(fields[k]) ? 'publics' : (typeof fields[k] === 'number' ? 'num' : 'text') }; if (!sameVal(f, fields[k], p[k])) bad.push(k); });
    renderAll();
    if (bad.length) { toast('Écriture non confirmée pour : ' + bad.join(', '), true); return false; }
    toast(okMsg || 'Enregistré.'); return true;
  } catch (e) { console.error(e); toast('Échec de l\'enregistrement : ' + (e.message || e), true); return false; }
}

  } finally { VERSING = false; }
}

/* ============================== helpers de la fiche ============================== */
const lst = v => Array.isArray(v) ? v : [];
const oriOf = p => lst(Array.isArray(p.Orientation_SD) && p.Orientation_SD[0] === 'L' ? p.Orientation_SD.slice(1) : p.Orientation_SD);

/* ============================== démarrage ============================== */
async function start(){
  showLoader(true);
  try {
    let n = 0; while (!grist.docApi && n < 20) { await new Promise(r => setTimeout(r, 100)); n++; }
    if (!(await checkAccess())) {
      document.getElementById('toolbar').style.display = 'none';
      document.getElementById('page').innerHTML = `<div class="empty"><p>Accès réservé</p><span>Cette page est réservée à la Chefferie, aux Responsables de suivi, aux Propriétaires et à la DGRH.</span></div>`; return;
    }
    await loadAll(); IS_OWNER = await detectOwner();
    PROFIL = IS_OWNER ? '' : (CLS || 'Chefferie'); RESTRICT = !IS_OWNER;           // CLS vide = non-Owner lisant toute la table Utilisateurs = Chefferie
    if (!droit('Visualiser')) {
      document.getElementById('toolbar').style.display = 'none';
      document.getElementById('page').innerHTML = `<div class="empty"><p>Accès réservé</p><span>Votre profil n'est pas autorisé à visualiser l'arbitrage (table « Droits_arbitrage »).</span></div>`; return;
    }
    renderAll();
  } catch (e) { console.error(e); document.getElementById('page').innerHTML = `<div class="empty"><p>Erreur de chargement</p><span>${esc(e.message)}</span></div>`; }
  finally { showLoader(false); }
}
grist.ready({ requiredAccess:'full', columns:[] });
let _started = false;
grist.onRecords(() => { if (!_started) { _started = true; start(); } else scheduleReload(); });
// Grist n'appelle pas toujours onRecords pour une table vide : on démarre quand même, sans attendre.
setTimeout(() => { if (!_started) { _started = true; start(); } }, 800);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && MODAL) closeModal(); });
</script>
